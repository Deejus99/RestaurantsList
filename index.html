
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🍽️ Restaurant Wishlist</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }  body { font-family: 'Segoe UI', sans-serif; background: #FFF8F0; color: #2D2D2D; min-height: 100vh; }
  #loading {    position: fixed; inset: 0; background: #FFF8F0;    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;    z-index: 9999;  }  .spinner {    width: 44px; height: 44px;    border: 5px solid #F2C4CE;    border-top-color: #6B2D3E;    border-radius: 50%;    animation: spin 0.8s linear infinite;  }  @keyframes spin { to { transform: rotate(360deg); } }
  #error-banner {    display: none; position: fixed; top: 0; left: 0; right: 0;    background: #c0392b; color: #fff; text-align: center;    padding: 10px 16px; font-size: 0.9rem; z-index: 10000;  }

  header {    background: linear-gradient(135deg, #6B2D3E 0%, #A0415A 100%);    color: #fff; padding: 16px 20px 12px; text-align: center;    box-shadow: 0 2px 8px rgba(107,45,62,0.3);
  }  header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.5px; }  header p { font-size: 0.82rem; opacity: 0.85; margin-top: 2px; }
  .tab-bar {    display: flex; background: #fff;    border-bottom: 2px solid #F2C4CE;    position: sticky; top: 0; z-index: 100;
  }
  .tab-btn {    flex: 1; padding: 11px 4px; font-size: 0.82rem; font-weight: 700;    border: none; background: none; cursor: pointer; color: #888;
    transition: color 0.2s, border-bottom 0.2s;    border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: #6B2D3E; border-bottom: 3px solid #6B2D3E; }
  .main-content { padding: 16px; max-width: 700px; margin: 0 auto; }

  .fab {    position: fixed; bottom: 24px; right: 20px;
    background: #6B2D3E; color: #fff; border: none;    width: 54px; height: 54px; border-radius: 50%; font-size: 1.6rem;    cursor: pointer; box-shadow: 0 4px 14px rgba(107,45,62,0.4);    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    z-index: 200;
  }  .fab:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(107,45,62,0.5); }

  .card {    background: #fff; border-radius: 12px;    box-shadow: 0 2px 8px rgba(0,0,0,0.07);    padding: 14px 16px; margin-bottom: 12px;    transition: box-shadow 0.2s;
  }  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.11); }

  .card-title { font-size: 1rem; font-weight: 700; color: #2D2D2D; }  .card-sub { font-size: 0.8rem; color: #888; margin-top: 2px; }
  .tag {    display: inline-block; padding: 2px 9px; border-radius: 20px;    font-size: 0.72rem; font-weight: 700; margin-right: 4px; margin-top: 4px;  }  .tag-cuisine { background: #FDE8EE; color: #6B2D3E; }  .tag-city { background: #E8F4FD; color: #1a6b9e; }  .tag-score { background: #FFF3CD; color: #856404; }  .tag-status-pending { background: #FFF3CD; color: #856404; }  .tag-status-done { background: #D4EDDA; color: #155724; }
  .btn {    border: none; border-radius: 8px; padding: 7px 14px;    font-size: 0.8rem; font-weight: 700; cursor: pointer;    transition: opacity 0.15s, transform 0.1s;
  }  .btn:hover { opacity: 0.88; transform: scale(1.03); }
  .btn-primary { background: #6B2D3E; color: #fff; }  .btn-danger { background: #c0392b; color: #fff; }  .btn-success { background: #27ae60; color: #fff; }  .btn-secondary { background: #eee; color: #444; }  .btn-sm { padding: 4px 10px; font-size: 0.74rem; }
  .modal-overlay {    display: none; position: fixed; inset: 0;    background: rgba(0,0,0,0.45); z-index: 1000;    align-items: center; justify-content: center;
  }  .modal-overlay.open { display: flex; }  .modal {    background: #fff; border-radius: 14px;    padding: 24px 22px; width: 92vw; max-width: 480px;    box-shadow: 0 8px 32px rgba(0,0,0,0.18);    max-height: 90vh; overflow-y: auto;  }  .modal h2 { font-size: 1.15rem; font-weight: 800; color: #6B2D3E; margin-bottom: 14px; }
  .form-group { margin-bottom: 13px; }  .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #555; margin-bottom: 4px; }  .form-group input, .form-group select, .form-group textarea {    width: 100%; border: 1.5px solid #E0C8CE; border-radius: 8px;    padding: 8px 10px; font-size: 0.88rem; background: #FFF8F0;    transition: border-color 0.2s;
  }  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {    outline: none; border-color: #6B2D3E;  }
  .star-row { display: flex; gap: 6px; font-size: 1.5rem; cursor: pointer; }  .star-row span { transition: transform 0.1s; }  .star-row span:hover { transform: scale(1.2); }

  .empty-state {    text-align: center; padding: 48px 20px; color: #aaa;
  }  .empty-state .emoji { font-size: 3rem; margin-bottom: 10px; }
  .empty-state p { font-size: 0.9rem; }

  .search-bar {    width: 100%; border: 1.5px solid #E0C8CE; border-radius: 8px;    padding: 8px 12px; font-size: 0.88rem; background: #fff;    margin-bottom: 14px; transition: border-color 0.2s;
  }  .search-bar:focus { outline: none; border-color: #6B2D3E; }
  .section-header {
    font-size: 0.78rem; font-weight: 800; color: #6B2D3E;    letter-spacing: 1px; text-transform: uppercase;    margin-bottom: 10px; margin-top: 4px;  }
  .score-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }  .score-label { font-size: 0.75rem; color: #888; width: 80px; text-align: right; }  .score-bar-wrap { flex: 1; min-width: 80px; background: #F2C4CE; border-radius: 6px; height: 8px; }  .score-bar { height: 8px; border-radius: 6px; background: linear-gradient(90deg, #6B2D3E, #A0415A); }  .score-val { font-size: 0.75rem; font-weight: 700; color: #6B2D3E; width: 26px; }
  .review-stars { color: #F4A825; font-size: 1.05rem; letter-spacing: 1px; }
  .user-chip {    display: inline-flex; align-items: center; gap: 5px;    background: #F2C4CE; color: #6B2D3E;    border-radius: 20px; padding: 3px 10px;    font-size: 0.76rem; font-weight: 700; margin: 2px;  }
  .stats-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);    gap: 10px; margin-bottom: 16px;
  }  .stat-card {    background: #fff; border-radius: 10px;    padding: 14px; text-align: center;    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }  .stat-num { font-size: 1.8rem; font-weight: 800; color: #6B2D3E; }  .stat-label { font-size: 0.75rem; color: #888; margin-top: 2px; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }  .filter-chip {    padding: 4px 12px; border-radius: 20px; border: 1.5px solid #E0C8CE;    font-size: 0.76rem; font-weight: 700; cursor: pointer;    background: #fff; color: #888; transition: all 0.15s;
  }  .filter-chip.active { background: #6B2D3E; color: #fff; border-color: #6B2D3E; }

  .desire-item {
    display: flex; justify-content: space-between; align-items: center;    padding: 8px 0; border-bottom: 1px solid #F2C4CE;
  }
  .desire-item:last-child { border-bottom: none; }
  .progress-ring { transform: rotate(-90deg); }  .progress-bg { fill: none; stroke: #F2C4CE; stroke-width: 6; }  .progress-fg { fill: none; stroke: #6B2D3E; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.5s; }
</style></head><body>

<div id="loading">  <div class="spinner"></div>  <div style="font-size:0.88rem;color:#6B2D3E;font-weight:bold;">Loading…</div></div>
<div id="error-banner"></div>
<div id="app" style="display:none;">  <header>    <h1>🍽️ Restaurant Wishlist</h1>    <p id="header-sub">Track, score & review your dining adventures</p>  </header>
  <div class="tab-bar">    <button class="tab-btn active" onclick="switchTab(0)">🗺️ Wishlist</button>    <button class="tab-btn" onclick="switchTab(1)">⏳ Pending</button>
    <button class="tab-btn" onclick="switchTab(2)">⭐ Reviews</button>    <button class="tab-btn" onclick="switchTab(3)">📊 Stats</button>
  </div>

  <div class="main-content" id="main-content"></div>
  <button class="fab" id="fab-btn" onclick="onFab()">＋</button>
</div>
<!-- Add/Edit Wishlist Modal -->
<div class="modal-overlay" id="modal-wishlist">
  <div class="modal">    <h2 id="modal-wishlist-title">➕ Add to Wishlist</h2>
    <div class="form-group">
      <label>Restaurant Name *</label>      <input type="text" id="w-name" placeholder="e.g. Noma, Le Bernardin…"/>
    </div>    <div class="form-group">
      <label>Cuisine</label>
      <input type="text" id="w-cuisine" placeholder="e.g. Japanese, Italian…"/>
    </div>
    <div class="form-group">
      <label>City</label>
      <input type="text" id="w-city" placeholder="e.g. Tokyo, Paris…"/>
    </div>
    <div class="form-group">
      <label>Notes</label>      <textarea id="w-notes" rows="2" placeholder="Why do you want to go? Tips…"></textarea>
    </div>
    <div class="form-group">      <label>Price Range</label>      <select id="w-price">
        <option value="">—</option>        <option value="$">$ Budget</option>        <option value="$$">$$ Mid-range</option>        <option value="$$$">$$$ Upscale</option>        <option value="$$$$">$$$$ Fine Dining</option>
      </select>
    </div>    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">      <button class="btn btn-secondary" onclick="closeModal('modal-wishlist')">Cancel</button>      <button class="btn btn-primary" onclick="saveWishlist()">Save</button>
    </div>
  </div></div>

<!-- Desire Score Modal --><div class="modal-overlay" id="modal-desire">
  <div class="modal">
    <h2>🔥 Rate Your Desire</h2>    <p style="font-size:0.83rem;color:#888;margin-bottom:14px;">How much do you want to visit <strong id="desire-rest-name"></strong>?</p>    <div id="desire-scores-form"></div>    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">      <button class="btn btn-secondary" onclick="closeModal('modal-desire')">Cancel</button>      <button class="btn btn-primary" onclick="saveDesireScores()">Save Scores</button>    </div>  </div>
</div>
<!-- Review Modal --><div class="modal-overlay" id="modal-review">  <div class="modal">    <h2 id="modal-review-title">✍️ Write a Review</h2>    <p style="font-size:0.83rem;color:#888;margin-bottom:14px;" id="review-rest-name-label"></p>    <div class="form-group">      <label>Reviewer</label>      <select id="r-user"></select>
    </div>
    <div class="form-group">
      <label>Overall Stars</label>      <div class="star-row" id="star-row">        <span onclick="setStar(1)">★</span>        <span onclick="setStar(2)">★</span>        <span onclick="setStar(3)">★</span>        <span onclick="setStar(4)">★</span>        <span onclick="setStar(5)">★</span>
      </div>    </div>    <div class="form-group">
      <label>Review Text</label>      <textarea id="r-text" rows="3" placeholder="Share your experience…"></textarea>    </div>
    <div class="form-group">      <label>Food Score (1–10)</label>      <input type="number" id="r-food" min="1" max="10" placeholder="7"/>
    </div>
    <div class="form-group">
      <label>Service Score (1–10)</label>      <input type="number" id="r-service" min="1" max="10" placeholder="7"/>
    </div>
    <div class="form-group">
      <label>Ambiance Score (1–10)</label>      <input type="number" id="r-ambiance" min="1" max="10" placeholder="7"/>    </div>
    <div class="form-group">      <label>Value Score (1–10)</label>      <input type="number" id="r-value" min="1" max="10" placeholder="7"/>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">      <button class="btn btn-secondary" onclick="closeModal('modal-review')">Cancel</button>
      <button class="btn btn-primary" onclick="saveReview()">Save Review</button>
    </div>
  </div>
</div>
<!-- View Reviews Modal --><div class="modal-overlay" id="modal-view-reviews">
  <div class="modal">
    <h2 id="vr-title">Reviews</h2>    <div id="vr-content"></div>    <div style="text-align:right;margin-top:14px;">      <button class="btn btn-secondary" onclick="closeModal('modal-view-reviews')">Close</button>
    </div>
  </div></div>

<script>const SUPABASE_URL = 'https://oofjwdtcasmderyduzki.supabase.co/rest/v1';const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vZmp3ZHRjYXNtZGVyeWR1emtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk1NzMxMTUsImV4cCI6MjA2NTE0OTExNX0.QHiRalAGCNQbKP4JQjLGMRGBqUqSn8aFt-H0JbXS0I8';

const STATE = {
  activeTab: 0,  wishlist: [],  pendingReviews: [],
  restaurants: [],
  reviews: [],
  users: [],
  desireScores: [],  wishlistFilter: 'all',  wishlistSearch: '',
  reviewSearch: '',  editingWishlistId: null,
  currentPendingId: null,
  currentRestaurantId: null,  currentStarRating: 0,
};

function uuid() {  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });}

function showLoading(v) {  document.getElementById('loading').style.display = v ? 'flex' : 'none';  document.getElementById('app').style.display = v ? 'none' : 'block';
}
function showError(msg) {  const el = document.getElementById('error-banner');  el.textContent = msg;
  el.style.display = 'block';  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function headers() {
  return {    'apikey': SUPABASE_KEY,    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',    'Prefer': 'return=representation'
  };
}
async function dbGet(table, query = '') {  const url = `${SUPABASE_URL}/${table}${query ? '?' + query : ''}`;  const res = await fetch(url, { headers: headers() });  if (!res.ok) throw new Error(await res.text());  return res.json();
}
async function dbInsert(table, data) {  const url = `${SUPABASE_URL}/${table}`;
  const res = await fetch(url, {    method: 'POST', headers: headers(), body: JSON.stringify(data)  });  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function dbUpdate(table, query, data) {  const url = `${SUPABASE_URL}/${table}?${query}`;  const res = await fetch(url, {    method: 'PATCH', headers: headers(), body: JSON.stringify(data)  });  if (!res.ok) throw new Error(await res.text());  return res.json();
}

async function dbDelete(table, query) {  const url = `${SUPABASE_URL}/${table}?${query}`;
  const res = await fetch(url, { method: 'DELETE', headers: headers() });  if (!res.ok) throw new Error(await res.text());
  return true;
}

async function loadAllData() {  const [users, wishlist, pendingReviews, restaurants, reviews, desireScores] = await Promise.all([    dbGet('users', 'order=name.asc'),    dbGet('wishlist', 'order=created_at.desc'),    dbGet('pending_reviews', 'order=visited_at.desc'),    dbGet('restaurants', 'order=name.asc'),    dbGet('reviews', 'order=created_at.desc'),
    dbGet('desire_scores', 'order=created_at.desc'),
  ]);  STATE.users = users || [];
  STATE.wishlist = wishlist || [];
  STATE.pendingReviews = pendingReviews || [];
  STATE.restaurants = restaurants || [];  STATE.reviews = reviews || [];
  STATE.desireScores = desireScores || [];}
function render() {  renderTabs();
  const mc = document.getElementById('main-content');  if (STATE.activeTab === 0) mc.innerHTML = renderWishlistTab();  else if (STATE.activeTab === 1) mc.innerHTML = renderPendingTab();  else if (STATE.activeTab === 2) mc.innerHTML = renderReviewsTab();  else if (STATE.activeTab === 3) mc.innerHTML = renderStatsTab();  updateFab();
}
function renderTabs() {  document.querySelectorAll('.tab-btn').forEach((btn, i) => {    btn.classList.toggle('active', i === STATE.activeTab);  });
}

function updateFab() {  const fab = document.getElementById('fab-btn');  if (STATE.activeTab === 0) { fab.style.display = 'flex'; fab.textContent = '＋'; }  else if (STATE.activeTab === 1) { fab.style.display = 'none'; }
  else if (STATE.activeTab === 2) { fab.style.display = 'none'; }
  else { fab.style.display = 'none'; }
}
function switchTab(i) {
  STATE.activeTab = i;  render();
}

function onFab() {
  if (STATE.activeTab === 0) openAddWishlist();
}
// ── WISHLIST TAB ──────────────────────────────────────────function renderWishlistTab() {  const cuisines = [...new Set(STATE.wishlist.map(w => w.cuisine).filter(Boolean))];  let filtered = STATE.wishlist;  if (STATE.wishlistFilter !== 'all') filtered = filtered.filter(w => w.cuisine === STATE.wishlistFilter);  if (STATE.wishlistSearch) {    const q = STATE.wishlistSearch.toLowerCase();    filtered = filtered.filter(w =>      (w.name||'').toLowerCase().includes(q) ||      (w.cuisine||'').toLowerCase().includes(q) ||      (w.city||'').toLowerCase().includes(q)
    );
  }
  const filterChips = `    <div class="filter-row">      <span class="filter-chip ${STATE.wishlistFilter==='all'?'active':''}" onclick="setWishlistFilter('all')">All</span>      ${cuisines.map(c => `<span class="filter-chip ${STATE.wishlistFilter===c?'active':''}" onclick="setWishlistFilter('${esc(c)}')">${esc(c)}</span>`).join('')}
    </div>`;

  if (!filtered.length) {    return filterChips + `<input class="search-bar" placeholder="🔍 Search wishlist…" value="${esc(STATE.wishlistSearch)}" oninput="STATE.wishlistSearch=this.value;render()"/>    <div class="empty-state"><div class="emoji">🌟</div><p>No restaurants yet.<br/>Tap ＋ to add your first!</p></div>`;  }
  const cards = filtered.map(w => {    const scores = STATE.desireScores.filter(d => d.restaurant_id === w.id);    const avgDesire = scores.length ? (scores.reduce((a,b) => a + (b.score||0), 0) / scores.length).toFixed(1) : null;
    const scorersHtml = scores.length      ? scores.map(d => {          const u = STATE.users.find(u => u.id === d.user_id);          return `<span class="user-chip">${esc(u?u.name:'?')} <span style="color:#A0415A">${d.score}/10</span></span>`;
        }).join('')      : '<span style="font-size:0.76rem;color:#bbb;">No desire scores yet</span>';
    return `<div class="card">      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>          <div class="card-title">${esc(w.name)}</div>          <div class="card-sub">${w.city ? esc(w.city) : ''}</div>
          <div>            ${w.cuisine ? `<span class="tag tag-cuisine">${esc(w.cuisine)}</span>` : ''}            ${w.price_range ? `<span class="tag tag-score">${esc(w.price_range)}</span>` : ''}            ${avgDesire ? `<span class="tag tag-score">🔥 ${avgDesire}/10</span>` : ''}
          </div>        </div>
        <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;">          <button class="btn btn-sm btn-primary" onclick="openDesireModal('${w.id}')">🔥 Desire</button>          <button class="btn btn-sm btn-success" onclick="markVisited('${w.id}')">✅ Visited</button>          <button class="btn btn-sm btn-secondary" onclick="openEditWishlist('${w.id}')">✏️</button>          <button class="btn btn-sm btn-danger" onclick="deleteWishlist('${w.id}')">🗑️</button>
        </div>      </div>      ${w.notes ? `<div style="font-size:0.78rem;color:#888;margin-top:6px;font-style:italic;">"${esc(w.notes)}"</div>` : ''}      <div style="margin-top:8px;">${scorersHtml}</div>
    </div>`;  }).join('');

  return `    <input class="search-bar" placeholder="🔍 Search wishlist…" value="${esc(STATE.wishlistSearch)}" oninput="STATE.wishlistSearch=this.value;render()"/>
    ${filterChips}    <div class="section-header">${filtered.length} place${filtered.length!==1?'s':''} to visit</div>
    ${cards}`;
}
function setWishlistFilter(f) { STATE.wishlistFilter = f; render(); }
// ── PENDING TAB ────────────────────────────────────────────function renderPendingTab() {  if (!STATE.pendingReviews.length) {    return `<div class="empty-state"><div class="emoji">⏳</div><p>No pending reviews.<br/>Mark a wishlist restaurant as visited!</p></div>`;
  }  return STATE.pendingReviews.map(pr => {    const hasReview = STATE.reviews.some(rv => rv.restaurant_id === pr.restaurant_id);    const visitedDate = pr.visited_at ? new Date(pr.visited_at).toLocaleDateString() : '';
    return `<div class="card">      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>          <div class="card-title">${esc(pr.name)}</div>
          <div class="card-sub">Visited ${visitedDate}</div>
          <div>            ${pr.cuisine ? `<span class="tag tag-cuisine">${esc(pr.cuisine)}</span>` : ''}            <span class="tag ${hasReview?'tag-status-done':'tag-status-pending'}">${hasReview?'✅ Reviewed':'⏳ Pending'}</span>
          </div>
        </div>        <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;">          <button class="btn btn-sm btn-primary" onclick="openReviewModal('${pr.restaurant_id}','${pr.id}')">✍️ Review</button>          <button class="btn btn-sm btn-danger" onclick="deletePending('${pr.id}')">🗑️</button>
        </div>      </div>
    </div>`;  }).join('');
}

// ── REVIEWS TAB ────────────────────────────────────────────function renderReviewsTab() {
  let reviews = [...STATE.reviews];  if (STATE.reviewSearch) {    const q = STATE.reviewSearch.toLowerCase();
    reviews = reviews.filter(r =>
      (r.restaurant_name||'').toLowerCase().includes(q) ||      (r.review_text||'').toLowerCase().includes(q)
    );
  }

  if (!reviews.length) {    return `<input class="search-bar" placeholder="🔍 Search reviews…" value="${esc(STATE.reviewSearch)}" oninput="STATE.reviewSearch=this.value;render()"/>    <div class="empty-state"><div class="emoji">⭐</div><p>No reviews yet.<br/>Visit a restaurant and write one!</p></div>`;
  }

  const byRestaurant = {};
  reviews.forEach(r => {    const key = r.restaurant_id || r.id;    if (!byRestaurant[key]) byRestaurant[key] = { name: r.restaurant_name, cuisine: r.cuisine, reviews: [] };
    byRestaurant[key].reviews.push(r);
  });
  const cards = Object.entries(byRestaurant).map(([rid, data]) => {    const avgStars = (data.reviews.reduce((a,b) => a+(b.stars||0),0)/data.reviews.length).toFixed(1);    const avgFood = avg(data.reviews.map(r=>r.food_score));
    const avgService = avg(data.reviews.map(r=>r.service_score));    const avgAmbiance = avg(data.reviews.map(r=>r.ambiance_score));    const avgValue = avg(data.reviews.map(r=>r.value_score));
    return `<div class="card">      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>          <div class="card-title">${esc(data.name||'Unknown')}</div>          ${data.cuisine ? `<span class="tag tag-cuisine">${esc(data.cuisine)}</span>` : ''}          <div class="review-stars">${'★'.repeat(Math.round(parseFloat(avgStars)))}${'☆'.repeat(5-Math.round(parseFloat(avgStars)))}</div>          <div style="font-size:0.75rem;color:#888;">${avgStars}/5 · ${data.reviews.length} review${data.reviews.length!==1?'s':''}</div>        </div>        <button class="btn btn-sm btn-secondary" onclick="viewReviews('${rid}')">View All</button>
      </div>      ${avgFood!==null?`      <div class="score-row">
        <div class="score-label">Food</div>        <div class="score-bar-wrap"><div class="score-bar" style="width:${avgFood*10}%"></div></div>        <div class="score-val">${avgFood}</div>
      </div>`:''}      ${avgService!==null?`
      <div class="score-row">
        <div class="score-label">Service</div>        <div class="score-bar-wrap"><div class="score-bar" style="width:${avgService*10}%"></div></div>        <div class="score-val">${avgService}</div>      </div>`:''}      ${avgAmbiance!==null?`      <div class="score-row">
        <div class="score-label">Ambiance</div>
        <div class="score-bar-wrap"><div class="score-bar" style="width:${avgAmbiance*10}%"></div></div>        <div class="score-val">${avgAmbiance}</div>
      </div>`:''}      ${avgValue!==null?`
      <div class="score-row">
        <div class="score-label">Value</div>        <div class="score-bar-wrap"><div class="score-bar" style="width:${avgValue*10}%"></div></div>
        <div class="score-val">${avgValue}</div>
      </div>`:''}
    </div>`;  }).join('');
  return `<input class="search-bar" placeholder="🔍 Search reviews…" value="${esc(STATE.reviewSearch)}" oninput="STATE.reviewSearch=this.value;render()"/>    <div class="section-header">${Object.keys(byRestaurant).length} restaurant${Object.keys(byRestaurant).length!==1?'s':''} reviewed</div>    ${cards}`;
}
function avg(arr) {  const valid = arr.filter(v => v != null && v !== '');  if (!valid.length) return null;  return (valid.reduce((a,b)=>a+parseFloat(b),0)/valid.length).toFixed(1);
}

function viewReviews(restaurantId) {  const data = STATE.reviews.filter(r => (r.restaurant_id||r.id) === restaurantId);
  if (!data.length) return;  document.getElementById('vr-title').textContent = '⭐ ' + (data[0].restaurant_name||'Reviews');  document.getElementById('vr-content').innerHTML = data.map(r => {    const u = STATE.users.find(u => u.id === r.user_id);    return `<div style="border-bottom:1px solid #F2C4CE;padding:10px 0;">      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="user-chip">${esc(u?u.name:'Anonymous')}</span>        <span class="review-stars">${'★'.repeat(r.stars||0)}${'☆'.repeat(5-(r.stars||0))}</span>
      </div>      ${r.review_text?`<div style="font-size:0.83rem;color:#555;margin-top:6px;font-style:italic;">"${esc(r.review_text)}"</div>`:''}      <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;">        ${r.food_score!=null?`<span style="font-size:0.74rem;color:#888;">🍴 Food: <b>${r.food_score}</b></span>`:''}        ${r.service_score!=null?`<span style="font-size:0.74rem;color:#888;">🤝 Service: <b>${r.service_score}</b></span>`:''}        ${r.ambiance_score!=null?`<span style="font-size:0.74rem;color:#888;">✨ Ambiance: <b>${r.ambiance_score}</b></span>`:''}        ${r.value_score!=null?`<span style="font-size:0.74rem;color:#888;">💰 Value: <b>${r.value_score}</b></span>`:''}
      </div>    </div>`;
  }).join('');  openModal('modal-view-reviews');
}
// ── STATS TAB ─────────────────────────────────────────────
function renderStatsTab() {  const totalWishlist = STATE.wishlist.length;  const totalReviewed = new Set(STATE.reviews.map(r=>r.restaurant_id)).size;  const totalReviews = STATE.reviews.length;  const avgRating = STATE.reviews.length ? avg(STATE.reviews.map(r=>r.stars)) : '—';
  const cuisineCounts = {};  STATE.wishlist.forEach(w => { if(w.cuisine) cuisineCounts[w.cuisine] = (cuisineCounts[w.cuisine]||0)+1; });  STATE.reviews.forEach(r => { if(r.cuisine) cuisineCounts[r.cuisine] = (cuisineCounts[r.cuisine]||0)+1; });  const topCuisines = Object.entries(cuisineCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topByScore = [...STATE.reviews].sort((a,b)=>(b.stars||0)-(a.stars||0)).slice(0,3);
  return `
    <div class="stats-grid">      <div class="stat-card"><div class="stat-num">${totalWishlist}</div><div class="stat-label">🗺️ On Wishlist</div></div>      <div class="stat-card"><div class="stat-num">${STATE.pendingReviews.length}</div><div class="stat-label">⏳ Pending Review</div></div>      <div class="stat-card"><div class="stat-num">${totalReviewed}</div><div class="stat-label">🍽️ Restaurants Tried</div></div>      <div class="stat-card"><div class="stat-num">${avgRating !== '—' ? avgRating + '★' : '—'}</div><div class="stat-label">⭐ Avg Rating</div></div>
    </div>

    ${topCuisines.length ? `    <div class="section-header">Top Cuisines</div>
    <div class="card">
      ${topCuisines.map(([c,n]) => `        <div class="desire-item">          <span style="font-size:0.85rem;font-weight:700;">${esc(c)}</span>          <span class="tag tag-cuisine">${n} places</span>
        </div>`).join('')}    </div>` : ''}

    ${topByScore.length ? `
    <div class="section-header">Top Rated Visits</div>    ${topByScore.map(r => `
      <div class="card">        <div class="card-title">${esc(r.restaurant_name||'Unknown')}</div>        <div class="review-stars">${'★'.repeat(r.stars||0)}${'☆'.repeat(5-(r.stars||0))}</div>        ${r.review_text?`<div style="font-size:0.78rem;color:#888;margin-top:4px;font-style:italic;">"${esc(r.review_text)}"</div>`:''}
      </div>`).join('')}` : ''}
    ${STATE.users.length ? `    <div class="section-header">Reviewers</div>
    <div class="card">
      ${STATE.users.map(u => {        const count = STATE.reviews.filter(r=>r.user_id===u.id).length;        return `<div class="desire-item">
          <span class="user-chip">${esc(u.name)}</span>          <span style="font-size:0.8rem;color:#888;">${count} review${count!==1?'s':''}</span>
        </div>`;
      }).join('')}    </div>` : ''}`;
}
// ── WISHLIST CRUD ──────────────────────────────────────────
function openAddWishlist() {  STATE.editingWishlistId = null;  document.getElementById('modal-wishlist-title').textContent = '➕ Add to Wishlist';  document.getElementById('w-name').value = '';
  document.getElementById('w-cuisine').value = '';
  document.getElementById('w-city').value = '';
  document.getElementById('w-notes').value = '';  document.getElementById('w-price').value = '';
  openModal('modal-wishlist');
}
function openEditWishlist(id) {
  const w = STATE.wishlist.find(x => x.id === id);  if (!w) return;  STATE.editingWishlistId = id;
  document.getElementById('modal-wishlist-title').textContent = '✏️ Edit Restaurant';  document.getElementById('w-name').value = w.name || '';
  document.getElementById('w-cuisine').value = w.cuisine || '';
  document.getElementById('w-city').value = w.city || '';
  document.getElementById('w-notes').value = w.notes || '';  document.getElementById('w-price').value = w.price_range || '';  openModal('modal-wishlist');
}

async function saveWishlist() {  const name = document.getElementById('w-name').value.trim();  if (!name) { alert('Restaurant name is required.'); return; }  const data = {
    name,    cuisine: document.getElementById('w-cuisine').value.trim(),
    city: document.getElementById('w-city').value.trim(),
    notes: document.getElementById('w-notes').value.trim(),    price_range: document.getElementById('w-price').value,  };
  showLoading(true);
  closeModal('modal-wishlist');
  try {
    if (STATE.editingWishlistId) {      await dbUpdate('wishlist', `id=eq.${STATE.editingWishlistId}`, data);
    } else {      await dbInsert('wishlist', { id: uuid(), ...data, created_at: new Date().toISOString() });    }    await loadAllData();    render();  } catch(e) {    showError('Failed to save: ' + e.message);  } finally {    showLoading(false);
  }}
async function deleteWishlist(id) {  if (!confirm('Remove this restaurant from wishlist?')) return;
  showLoading(true);  try {    await dbDelete('desire_scores', `restaurant_id=eq.${id}`);    await dbDelete('wishlist', `id=eq.${id}`);    await loadAllData();
    render();  } catch(e) {    showError('Failed to delete: ' + e.message);  } finally {    showLoading(false);
  }}
async function markVisited(restaurantId) {  if (!confirm('Mark this restaurant as visited? It will move to Pending Reviews.')) return;  const r = STATE.wishlist.find(x => x.id === restaurantId);
  if (!r) return;
  showLoading(true);
  try {    const newPendingId = uuid();
    await dbInsert('pending_reviews', {      id: newPendingId,
      restaurant_id: restaurantId,
      name: r.name,
      cuisine: r.cuisine,      visited_at: new Date().toISOString()
    });    await dbDelete('desire_scores', `restaurant_id=eq.${restaurantId}`);    await dbDelete('wishlist', `id=eq.${restaurantId}`);
    await loadAllData();    STATE.activeTab = 1;    render();
  } catch(e) {
    showError('Failed to mark visited: ' + e.message);
  } finally {
    showLoading(false);
  }
}
// ── DESIRE SCORES ──────────────────────────────────────────function openDesireModal(restaurantId) {  const w = STATE.wishlist.find(x => x.id === restaurantId);
  if (!w) return;  STATE.currentRestaurantId = restaurantId;  document.getElementById('desire-rest-name').textContent = w.name;
  const form = STATE.users.map(u => {    const existing = STATE.desireScores.find(d => d.restaurant_id === restaurantId && d.user_id === u.id);
    const val = existing ? existing.score : '';    return `<div class="form-group">
      <label>${esc(u.name)}</label>      <input type="number" min="1" max="10" placeholder="1–10" value="${val}" id="desire-${u.id}"/>
    </div>`;  }).join('');  document.getElementById('desire-scores-form').innerHTML = form || '<p style="color:#aaa;font-size:0.85rem;">No users found. Add users first.</p>';
  openModal('modal-desire');
}
async function saveDesireScores() {  showLoading(true);
  closeModal('modal-desire');
  try {
    for (const u of STATE.users) {
      const inp = document.getElementById(`desire-${u.id}`);      if (!inp) continue;
      const val = parseInt(inp.value);      if (isNaN(val) || val < 1 || val > 10) continue;      const existing = STATE.desireScores.find(d => d.restaurant_id === STATE.currentRestaurantId && d.user_id === u.id);      if (existing) {        await dbUpdate('desire_scores', `id=eq.${existing.id}`, { score: val });
      } else {        await dbInsert('desire_scores', {
          id: uuid(),
          restaurant_id: STATE.currentRestaurantId,          user_id: u.id,          score: val,          created_at: new Date().toISOString()
        });
      }
    }
    await loadAllData();
    render();
  } catch(e) {    showError('Failed to save desire scores: ' + e.message);
  } finally {
    showLoading(false);
  }
}
// ── REVIEW CRUD ────────────────────────────────────────────function openReviewModal(restaurantId, pendingId) {  STATE.currentRestaurantId = restaurantId;
  STATE.currentPendingId = pendingId;  STATE.currentStarRating = 0;
  const pr = STATE.pendingReviews.find(p => p.id === pendingId);  document.getElementById('modal-review-title').textContent = '✍️ Write a Review';  document.getElementById('review-rest-name-label').textContent = pr ? pr.name : '';
  const userSel = document.getElementById('r-user');  userSel.innerHTML = STATE.users.map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
  document.getElementById('r-text').value = '';
  document.getElementById('r-food').value = '';
  document.getElementById('r-service').value = '';  document.getElementById('r-ambiance').value = '';  document.getElementById('r-value').value = '';
  setStar(0);
  openModal('modal-review');
}

function setStar(n) {
  STATE.currentStarRating = n;  document.querySelectorAll('#star-row span').forEach((s, i) => {    s.style.color = i < n ? '#F4A825' : '#ddd';
  });}

async function saveReview() {
  const userId = document.getElementById('r-user').value;  if (!userId) { alert('Please select a reviewer.'); return; }
  const pr = STATE.pendingReviews.find(p => p.id === STATE.currentPendingId);
  const data = {
    id: uuid(),    restaurant_id: STATE.currentRestaurantId,
    restaurant_name: pr ? pr.name : '',
    cuisine: pr ? pr.cuisine : '',
    user_id: userId,    stars: STATE.currentStarRating || null,    review_text: document.getElementById('r-text').value.trim(),    food_score: parseInt(document.getElementById('r-food').value) || null,    service_score: parseInt(document.getElementById('r-service').value) || null,
    ambiance_score: parseInt(document.getElementById('r-ambiance').value) || null,    value_score: parseInt(document.getElementById('r-value').value) || null,    created_at: new Date().toISOString()
  };

  showLoading(true);
  closeModal('modal-review');
  try {    await dbInsert('reviews', data);
    await loadAllData();
    render();
  } catch(e) {
    showError('Failed to save review: ' + e.message);
  } finally {
    showLoading(false);
  }
}
async function deletePending(pendingId) {
  if (!confirm('Remove this pending review?')) return;
  showLoading(true);
  try {    await dbDelete('pending_reviews', `id=eq.${pendingId}`);
    await loadAllData();
    render();
  } catch(e) {    showError('Failed to delete: ' + e.message);
  } finally {
    showLoading(false);
  }
}
// ── MODAL HELPERS ──────────────────────────────────────────function openModal(id) { document.getElementById(id).classList.add('open'); }function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {    if (e.target === overlay) overlay.classList.remove('open');
  });
});

function esc(str) {
  if (!str) return '';  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// ── INIT ───────────────────────────────────────────────────async function init() {
  showLoading(true);
  try {
    await loadAllData();
    render();
  } catch(e) {
    showError('Failed to load data: ' + e.message);    document.getElementById('loading').style.display = 'none';    document.getElementById('app').style.display = 'block';
  } finally {    showLoading(false);
  }
}
init();
// Auto-refresh every 60 secondssetInterval(async () => {  try {    await loadAllData();
    render();  } catch(e) {}}, 60000);
</script></body>
