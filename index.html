<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Tracker</title>
  <style>
    :root {
      --burgundy: #6b1f2a;
      --burgundy-dark: #4b141d;
      --burgundy-light: #8b2f3d;
      --cream: #fbf4e8;
      --cream-dark: #f1dfc3;
      --gold: #c8943f;
      --ink: #2b1b18;
      --muted: #7a6259;
      --card: #fffaf1;
      --danger: #b42318;
      --success: #2f6f4e;
      --border: #dec8a6;
      --shadow: 0 10px 30px rgba(75, 20, 29, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(200, 148, 63, 0.18), transparent 34rem),
        linear-gradient(135deg, #fbf4e8 0%, #f6e7cf 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--cream);
      color: var(--burgundy);
    }

    .spinner {
      width: 54px;
      height: 54px;
      border: 5px solid var(--cream-dark);
      border-top-color: var(--burgundy);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    #loading-step {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.02em;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #status-indicator {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 250, 241, 0.95);
      padding: 8px 13px;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 14px;
    }

    #status-indicator::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
    }

    #status-indicator.offline::before {
      background: var(--danger);
    }

    #error-toast {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 1001;
      display: none;
      max-width: min(420px, calc(100vw - 36px));
      border: 1px solid rgba(180, 35, 24, 0.25);
      border-radius: 14px;
      background: #fff4f2;
      color: var(--danger);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      line-height: 1.35;
    }

    #app {
      display: none;
      min-height: 100vh;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      border-bottom: 3px double var(--border);
      background: rgba(255, 250, 241, 0.82);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      padding: 26px 0 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 2px solid var(--gold);
      border-radius: 50%;
      background: var(--burgundy);
      box-shadow: var(--shadow);
      color: var(--cream);
      font-size: 28px;
    }

    h1 {
      margin: 0;
      color: var(--burgundy-dark);
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 16px;
      font-style: italic;
    }

    .user-panel {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      display: block;
      margin: 0 0 6px;
      color: var(--burgundy-dark);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fffdf8;
      color: var(--ink);
      padding: 11px 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(200, 148, 63, 0.18);
    }

    select {
      min-width: 190px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      background: var(--burgundy);
      color: var(--cream);
      padding: 11px 16px;
      font-weight: bold;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }

    .btn:hover {
      background: var(--burgundy-dark);
      box-shadow: 0 8px 20px rgba(107, 31, 42, 0.18);
      transform: translateY(-1px);
    }

    .btn.secondary {
      border: 1px solid var(--border);
      background: #fffaf1;
      color: var(--burgundy);
    }

    .btn.secondary:hover {
      background: var(--cream-dark);
    }

    .btn.success {
      background: var(--success);
    }

    .btn.success:hover {
      background: #24583e;
    }

    nav {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(241, 223, 195, 0.55);
      padding: 7px;
    }

    .tab-btn {
      white-space: nowrap;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--burgundy);
      padding: 10px 16px;
      font-weight: bold;
    }

    .tab-btn.active {
      background: var(--card);
      box-shadow: 0 5px 15px rgba(75, 20, 29, 0.12);
      color: var(--burgundy-dark);
    }

    main {
      padding: 26px 0 54px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat-card,
    .panel,
    .restaurant-card,
    .empty-state {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 250, 241, 0.92);
      box-shadow: var(--shadow);
    }

    .stat-card {
      padding: 18px;
    }

    .stat-label {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .stat-value {
      margin: 8px 0 0;
      color: var(--burgundy-dark);
      font-size: 36px;
      font-weight: bold;
      line-height: 1;
    }

    .panel {
      margin-bottom: 18px;
      padding: 20px;
    }

    .panel h2 {
      margin: 0;
      color: var(--burgundy-dark);
      font-size: 24px;
    }

    .panel p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .add-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin-top: 18px;
    }

    .list {
      display: grid;
      gap: 16px;
    }

    .restaurant-card {
      padding: 20px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    .restaurant-title {
      margin: 0;
      color: var(--burgundy-dark);
      font-size: 25px;
      line-height: 1.1;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 7px;
      color: var(--muted);
      font-size: 15px;
    }

    .dot {
      color: var(--gold);
    }

    .stars {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .star-btn,
    .star-static {
      border: 0;
      background: transparent;
      color: var(--cream-dark);
      padding: 0 1px;
      font-size: 28px;
      line-height: 1;
    }

    .star-btn {
      transition: transform 0.12s ease, color 0.12s ease;
    }

    .star-btn:hover {
      color: var(--gold);
      transform: scale(1.12);
    }

    .star-btn.active,
    .star-static.active {
      color: var(--gold);
    }

    .card-actions {
      min-width: 285px;
      display: grid;
      gap: 12px;
    }

    .score-box,
    .review-form {
      border: 1px solid rgba(222, 200, 166, 0.72);
      border-radius: 16px;
      background: rgba(251, 244, 232, 0.75);
      padding: 14px;
    }

    .score-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .review-form {
      width: min(560px, 100%);
    }

    .review-form textarea {
      min-height: 92px;
      resize: vertical;
      margin-top: 10px;
    }

    .review-submit {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .review-note {
      margin-top: 14px;
      border-left: 4px solid var(--gold);
      border-radius: 12px;
      background: rgba(251, 244, 232, 0.8);
      padding: 13px 14px;
      color: var(--ink);
      line-height: 1.5;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
    }

    .empty-icon {
      margin: 0 auto 12px;
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border-radius: 50%;
      background: var(--burgundy);
      color: var(--cream);
      font-size: 28px;
    }

    .empty-state h3 {
      margin: 0;
      color: var(--burgundy-dark);
      font-size: 22px;
    }

    .empty-state p {
      margin: 7px auto 0;
      max-width: 440px;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 780px) {
      .stats,
      .add-form {
        grid-template-columns: 1fr;
      }

      .card-row {
        flex-direction: column;
      }

      .card-actions {
        width: 100%;
        min-width: 0;
      }

      .user-panel {
        width: 100%;
      }

      .user-panel > div {
        flex: 1;
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner" id="loading-spinner"></div>
    <div id="loading-step">Loading…</div>
  </div>

  <div id="status-indicator">Connected</div>
  <div id="error-toast"></div>

  <div id="app">
    <header>
      <div class="container header-inner">
        <div class="topbar">
          <div class="brand">
            <div class="brand-mark">🍽️</div>
            <div>
              <h1>Restaurant Tracker</h1>
              <p class="subtitle">Wishlist, visits, and reviews in one shared place.</p>
            </div>
          </div>

          <div class="user-panel">
            <div>
              <label for="current-user">Current user</label>
              <select id="current-user"></select>
            </div>
            <button class="btn secondary" id="refresh-btn" type="button">Refresh</button>
          </div>
        </div>

        <nav aria-label="Restaurant tracker sections">
          <button class="tab-btn active" type="button" data-tab="0">Wishlist</button>
          <button class="tab-btn" type="button" data-tab="1">Pending Reviews</button>
          <button class="tab-btn" type="button" data-tab="2">Completed Reviews</button>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="stats" aria-label="Restaurant stats">
        <article class="stat-card">
          <p class="stat-label">Wishlist</p>
          <p class="stat-value" id="stat-wishlist">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">Pending Reviews</p>
          <p class="stat-value" id="stat-pending">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">Completed Reviews</p>
          <p class="stat-value" id="stat-reviews">0</p>
        </article>
      </section>

      <div id="tab-content"></div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const STATE = {
      users: [],
      wishlist: [],
      desireScores: [],
      pendingReviews: [],
      reviews: [],
      activeTab: 0,
      currentUser: null
    };

    const els = {
      loading: document.getElementById('loading'),
      statusIndicator: document.getElementById('status-indicator'),
      errorToast: document.getElementById('error-toast'),
      app: document.getElementById('app'),
      currentUser: document.getElementById('current-user'),
      refreshBtn: document.getElementById('refresh-btn'),
      tabButtons: Array.from(document.querySelectorAll('.tab-btn')),
      tabContent: document.getElementById('tab-content'),
      statWishlist: document.getElementById('stat-wishlist'),
      statPending: document.getElementById('stat-pending'),
      statReviews: document.getElementById('stat-reviews')
    };

    function debugLog() {}

    function showLoading(show) {
      els.loading.style.display = show ? 'flex' : 'none';
    }

    function showError(message) {
      els.errorToast.textContent = message;
      els.errorToast.style.display = 'block';
      window.clearTimeout(showError.timer);
      showError.timer = window.setTimeout(() => {
        els.errorToast.style.display = 'none';
      }, 6500);
    }

    function showFatalError(message) {
      showLoading(false);
      setConnectionStatus(false);
      showError(message);
      els.app.style.display = 'block';
      render();
    }

    function setConnectionStatus(connected) {
      els.statusIndicator.style.display = 'flex';
      els.statusIndicator.classList.toggle('offline', !connected);
      els.statusIndicator.textContent = connected ? 'Connected' : 'Offline';
    }

    function getSession(key) {
      try {
        return localStorage.getItem(`restaurantTracker.${key}`);
      } catch {
        return null;
      }
    }

    function setSession(key, value) {
      try {
        localStorage.setItem(`restaurantTracker.${key}`, value);
      } catch {}
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function formatDate(value) {
      if (!value) return 'Unknown date';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return 'Unknown date';
      return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function authHeaders(preferRepresentation = false) {
      const headers = {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      };
      if (preferRepresentation) headers.Prefer = 'return=representation';
      return headers;
    }

    async function dbGet(table, query = '') {
      const url = `${SUPABASE_URL}/rest/v1/${table}${query ? `?${query}` : ''}`;
      const res = await fetch(url, {
        method: 'GET',
        headers: authHeaders()
      });
      const bodyText = await res.text();
      if (!res.ok) throw new Error(bodyText || `${res.status} ${res.statusText}`);
      return bodyText ? JSON.parse(bodyText) : [];
    }

    async function dbInsert(table, data) {
      const url = `${SUPABASE_URL}/rest/v1/${table}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify(data)
      });
      const bodyText = await res.text();
      if (!res.ok) throw new Error(bodyText || `${res.status} ${res.statusText}`);
      return bodyText ? JSON.parse(bodyText) : null;
    }

    async function dbUpdate(table, data, filter) {
      const url = `${SUPABASE_URL}/rest/v1/${table}?${filter}`;
      const res = await fetch(url, {
        method: 'PATCH',
        headers: authHeaders(true),
        body: JSON.stringify(data)
      });
      const bodyText = await res.text();
      if (!res.ok) throw new Error(bodyText || `${res.status} ${res.statusText}`);
      return bodyText ? JSON.parse(bodyText) : null;
    }

    async function dbDelete(table, filter) {
      const url = `${SUPABASE_URL}/rest/v1/${table}?${filter}`;
      const res = await fetch(url, {
        method: 'DELETE',
        headers: authHeaders()
      });
      const bodyText = await res.text();
      if (!res.ok) throw new Error(bodyText || `${res.status} ${res.statusText}`);
      return bodyText ? JSON.parse(bodyText) : null;
    }

    async function loadAllData() {
      const [users, wishlist, desireScores, pendingReviews, reviews] = await Promise.all([
        dbGet('users', 'order=created_at.asc'),
        dbGet('wishlist', 'order=created_at.asc'),
        dbGet('desire_scores', 'order=created_at.asc'),
        dbGet('pending_reviews', 'order=created_at.asc'),
        dbGet('reviews', 'order=created_at.asc')
      ]);
      STATE.users = users || [];
      STATE.wishlist = wishlist || [];
      STATE.desireScores = desireScores || [];
      STATE.pendingReviews = pendingReviews || [];
      STATE.reviews = reviews || [];
    }

    function currentUserRecord() {
      return STATE.users.find(u => u.name === STATE.currentUser)
        || STATE.users.find(u => u.id === STATE.currentUser)
        || STATE.users[0]
        || null;
    }

    function userLabel(user) {
      return user.name || user.email || user.id || 'Unknown';
    }

    function userKey(user) {
      return user.id || user.name || user.email;
    }

    function getScoresForRestaurant(restaurantId) {
      return STATE.desireScores.filter(score => score.restaurant_id === restaurantId);
    }

    function getUserScore(restaurantId, user) {
      if (!user) return null;
      const key = userKey(user);
      return STATE.desireScores.find(score =>
        score.restaurant_id === restaurantId &&
        (score.user_id === key || score.user_name === user.name)
      );
    }

    function getCombinedScore(restaurantId) {
      const scores = getScoresForRestaurant(restaurantId);
      if (!scores.length) return 0;
      return scores.reduce((sum, score) => sum + Number(score.score || 0), 0) / scores.length;
    }

    function ratingStars(value, interactive = false, restaurantId = null, mode = 'desire') {
      const rounded = Math.round(Number(value || 0));
      return Array.from({ length: 5 }, (_, i) => {
        const starValue = i + 1;
        const active = starValue <= rounded;
        if (interactive) {
          return `<button type="button" class="star-btn ${active ? 'active' : ''}" data-restaurant-id="${escapeHtml(restaurantId)}" data-score="${starValue}" data-mode="${escapeHtml(mode)}" aria-label="${starValue} star">${active ? '★' : '☆'}</button>`;
        }
        return `<span class="star-static ${active ? 'active' : ''}" aria-label="${starValue} star">${active ? '★' : '☆'}</span>`;
      }).join('');
    }

    function pendingIdSet() {
      return new Set(
        STATE.pendingReviews
          .flatMap(pr => [pr.id, pr.restaurant_id])
          .filter(Boolean)
      );
    }

    function renderStats() {
      const pendingIds = pendingIdSet();
      const visibleWishlist = STATE.wishlist.filter(r => !pendingIds.has(r.id));
      els.statWishlist.textContent = visibleWishlist.length;
      els.statPending.textContent = STATE.pendingReviews.length;
      els.statReviews.textContent = STATE.reviews.length;
    }

    function renderUsers() {
      els.currentUser.innerHTML = '';
      if (!STATE.users.length) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'No users found';
        els.currentUser.appendChild(option);
        els.currentUser.disabled = true;
        return;
      }

      els.currentUser.disabled = false;
      if (!STATE.currentUser) STATE.currentUser = userLabel(STATE.users[0]);

      STATE.users.forEach(user => {
        const option = document.createElement('option');
        option.value = userLabel(user);
        option.textContent = userLabel(user);
        option.selected = option.value === STATE.currentUser;
        els.currentUser.appendChild(option);
      });
    }

    function renderTabs() {
      els.tabButtons.forEach((btn, index) => {
        btn.classList.toggle('active', index === STATE.activeTab);
      });
    }

    function emptyState(title, description) {
      return `
        <div class="empty-state">
          <div class="empty-icon">🍴</div>
          <h3>${escapeHtml(title)}</h3>
          <p>${escapeHtml(description)}</p>
        </div>
      `;
    }

    function renderWishlist() {
      const pendingIds = new Set(
        STATE.pendingReviews
          .flatMap(pr => [pr.id, pr.restaurant_id])
          .filter(Boolean)
      );
      const visibleWishlist = STATE.wishlist.filter(r => !pendingIds.has(r.id));
      const sorted = [...visibleWishlist].sort((a, b) => {
        const scoreA = getCombinedScore(a.id);
        const scoreB = getCombinedScore(b.id);
        return scoreB - scoreA;
      });

      if (!sorted.length) {
        return `
          <section>
            <div class="panel">
              <h2>Add to Wishlist</h2>
              <p>Save a restaurant and let everyone score how much they want to go.</p>
              ${renderAddForm()}
            </div>
            ${emptyState('No wishlist restaurants', 'Add a restaurant above to start tracking where you want to go.')}
          </section>
        `;
      }

      const user = currentUserRecord();
      return `
        <section>
          <div class="panel">
            <h2>Add to Wishlist</h2>
            <p>Save a restaurant and let everyone score how much they want to go.</p>
            ${renderAddForm()}
          </div>
          <div class="list">
            ${sorted.map(r => {
              const avg = getCombinedScore(r.id);
              const userScore = getUserScore(r.id, user);
              const scoreCount = getScoresForRestaurant(r.id).length;
              return `
                <article class="restaurant-card">
                  <div class="card-row">
                    <div>
                      <h3 class="restaurant-title">${escapeHtml(r.name)}</h3>
                      <div class="meta">
                        <span>${escapeHtml(r.cuisine || 'Cuisine not specified')}</span>
                        <span class="dot">•</span>
                        <span>Added ${formatDate(r.created_at)}</span>
                      </div>
                      <div class="meta">
                        <span class="stars">${ratingStars(avg)}</span>
                        <strong>${avg ? avg.toFixed(1) : 'No'} average</strong>
                        <span>(${scoreCount} ${scoreCount === 1 ? 'score' : 'scores'})</span>
                      </div>
                    </div>
                    <div class="card-actions">
                      <div class="score-box">
                        <p class="score-title">Your desire score</p>
                        <div class="stars">${ratingStars(userScore ? userScore.score : 0, true, r.id, 'desire')}</div>
                      </div>
                      <button type="button" class="btn success" data-action="mark-visited" data-restaurant-id="${escapeHtml(r.id)}">Mark as Visited</button>
                    </div>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function renderAddForm() {
      return `
        <form class="add-form" id="add-restaurant-form">
          <div>
            <label for="restaurant-name">Restaurant name</label>
            <input id="restaurant-name" name="name" type="text" required placeholder="e.g. The Garden Table">
          </div>
          <div>
            <label for="restaurant-cuisine">Cuisine</label>
            <input id="restaurant-cuisine" name="cuisine" type="text" placeholder="e.g. Italian">
          </div>
          <button class="btn" type="submit">Add Restaurant</button>
        </form>
      `;
    }

    function renderPending() {
      const sorted = [...STATE.pendingReviews].sort((a, b) => new Date(b.visited_at || 0) - new Date(a.visited_at || 0));

      if (!sorted.length) {
        return `
          <section>
            <div class="panel">
              <h2>Pending Reviews</h2>
              <p>Restaurants marked as visited that still need reviews.</p>
            </div>
            ${emptyState('No pending reviews', 'When a wishlist restaurant is marked as visited, it will appear here.')}
          </section>
        `;
      }

      const user = currentUserRecord();
      return `
        <section>
          <div class="panel">
            <h2>Pending Reviews</h2>
            <p>Restaurants marked as visited that still need reviews.</p>
          </div>
          <div class="list">
            ${sorted.map(pr => {
              const restaurantId = pr.restaurant_id || pr.id;
              const userId = user ? userKey(user) : null;
              const existingReview = user ? STATE.reviews.find(review =>
                review.restaurant_id === restaurantId &&
                (review.user_id === userId || review.user_name === user.name)
              ) : null;
              const allReviewsForRestaurant = STATE.reviews.filter(review => review.restaurant_id === restaurantId);
              return `
                <article class="restaurant-card">
                  <div class="card-row">
                    <div>
                      <h3 class="restaurant-title">${escapeHtml(pr.name)}</h3>
                      <div class="meta">
                        <span>${escapeHtml(pr.cuisine || 'Cuisine not specified')}</span>
                        <span class="dot">•</span>
                        <span>Visited ${formatDate(pr.visited_at)}</span>
                        <span class="dot">•</span>
                        <span>${allReviewsForRestaurant.length} ${allReviewsForRestaurant.length === 1 ? 'review' : 'reviews'}</span>
                      </div>
                    </div>
                    <form class="review-form" data-action="submit-review" data-restaurant-id="${escapeHtml(restaurantId)}">
                      <p class="score-title">${existingReview ? 'Update your review' : 'Your review'}</p>
                      <input type="hidden" name="rating" value="${existingReview ? Number(existingReview.rating || 0) : 0}">
                      <div class="stars">${ratingStars(existingReview ? existingReview.rating : 0, true, restaurantId, 'review')}</div>
                      <textarea name="notes" placeholder="What did you think?">${escapeHtml(existingReview ? existingReview.notes || '' : '')}</textarea>
                      <div class="review-submit">
                        <button class="btn" type="submit">${existingReview ? 'Update Review' : 'Submit Review'}</button>
                      </div>
                    </form>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function renderReviews() {
      const sorted = [...STATE.reviews].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

      if (!sorted.length) {
        return `
          <section>
            <div class="panel">
              <h2>Completed Reviews</h2>
              <p>All submitted restaurant reviews.</p>
            </div>
            ${emptyState('No reviews yet', 'Submitted reviews will appear here.')}
          </section>
        `;
      }

      return `
        <section>
          <div class="panel">
            <h2>Completed Reviews</h2>
            <p>All submitted restaurant reviews.</p>
          </div>
          <div class="list">
            ${sorted.map(review => {
              const pending = STATE.pendingReviews.find(pr => pr.id === review.restaurant_id || pr.restaurant_id === review.restaurant_id);
              const wishlist = STATE.wishlist.find(r => r.id === review.restaurant_id);
              const restaurant = pending || wishlist || {};
              const user = STATE.users.find(u => userKey(u) === review.user_id || u.name === review.user_name) || {};
              return `
                <article class="restaurant-card">
                  <div class="card-row">
                    <div>
                      <h3 class="restaurant-title">${escapeHtml(restaurant.name || review.restaurant_name || 'Restaurant')}</h3>
                      <div class="meta">
                        <span>${escapeHtml(restaurant.cuisine || 'Cuisine not specified')}</span>
                        <span class="dot">•</span>
                        <span>Reviewed by ${escapeHtml(userLabel(user) || review.user_id || 'Unknown')}</span>
                        <span class="dot">•</span>
                        <span>${formatDate(review.created_at)}</span>
                      </div>
                    </div>
                    <div class="stars">${ratingStars(review.rating)}</div>
                  </div>
                  ${review.notes ? `<div class="review-note">${escapeHtml(review.notes)}</div>` : ''}
                </article>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function renderActiveTab() {
      if (STATE.activeTab === 1) return renderPending();
      if (STATE.activeTab === 2) return renderReviews();
      return renderWishlist();
    }

    function render() {
      renderUsers();
      renderStats();
      renderTabs();
      els.tabContent.innerHTML = renderActiveTab();
      setSession('activeTab', String(STATE.activeTab));
      if (STATE.currentUser) setSession('currentUser', STATE.currentUser);
    }

    async function addRestaurant(event) {
      event.preventDefault();
      const form = event.target;
      const name = form.elements.name.value.trim();
      const cuisine = form.elements.cuisine.value.trim();

      if (!name) return showError('Restaurant name is required.');

      showLoading(true);
      try {
        await dbInsert('wishlist', {
          name,
          cuisine: cuisine || null,
          created_at: new Date().toISOString()
        });
        await loadAllData();
        setConnectionStatus(true);
        render();
      } catch (e) {
        setConnectionStatus(false);
        showError('Failed to add restaurant: ' + e.message);
      } finally {
        showLoading(false);
      }
    }

    async function saveDesireScore(restaurantId, score) {
      const user = currentUserRecord();
      if (!user) return showError('Please select a user first.');

      const userId = userKey(user);

      showLoading(true);
      try {
        const existing = getUserScore(restaurantId, user);
        if (existing) {
          await dbUpdate('desire_scores', {
            score: Number(score),
            updated_at: new Date().toISOString()
          }, `restaurant_id=eq.${restaurantId}&user_id=eq.${userId}`);
        } else {
          await dbInsert('desire_scores', {
            restaurant_id: restaurantId,
            user_id: userId,
            score: Number(score),
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          });
        }
        await loadAllData();
        setConnectionStatus(true);
        render();
      } catch (e) {
        setConnectionStatus(false);
        showError('Failed to save score: ' + e.message);
      } finally {
        showLoading(false);
      }
    }

    async function markVisited(restaurantId) {
      if (!confirm('Mark this restaurant as visited? It will move to Pending Reviews.')) return;
      const r = STATE.wishlist.find(x => x.id === restaurantId);
      if (!r) return showError('Restaurant not found.');

      showLoading(true);
      try {
        const alreadyPending = STATE.pendingReviews.some(
          pr => pr.id === restaurantId || pr.restaurant_id === restaurantId
        );

        if (!alreadyPending) {
          await dbInsert('pending_reviews', {
            id: restaurantId,
            restaurant_id: restaurantId,
            name: r.name,
            cuisine: r.cuisine,
            visited_at: new Date().toISOString()
          });
        }

        await dbDelete('desire_scores', `restaurant_id=eq.${restaurantId}`);
        // Do NOT delete from wishlist because pending_reviews.restaurant_id references wishlist.id with ON DELETE CASCADE.

        await new Promise(resolve => setTimeout(resolve, 500));
        await loadAllData();
        STATE.activeTab = 1;
        setConnectionStatus(true);
        render();
      } catch(e) {
        setConnectionStatus(false);
        showError('Failed to mark visited: ' + e.message);
      } finally {
        showLoading(false);
      }
    }

    async function submitReview(event) {
      event.preventDefault();
      const form = event.target;
      const restaurantId = form.dataset.restaurantId;
      const user = currentUserRecord();
      if (!user) return showError('Please select a user first.');

      const userId = userKey(user);
      const rating = Number(form.elements.rating.value || 0);
      const notes = form.elements.notes.value.trim();

      if (!rating) return showError('Please choose a rating before submitting your review.');

      showLoading(true);
      try {
        const existing = STATE.reviews.find(review => review.restaurant_id === restaurantId && review.user_id === userId);
        if (existing) {
          await dbUpdate('reviews', {
            rating,
            notes: notes || null,
            updated_at: new Date().toISOString()
          }, `restaurant_id=eq.${restaurantId}&user_id=eq.${userId}`);
        } else {
          await dbInsert('reviews', {
            restaurant_id: restaurantId,
            user_id: userId,
            rating,
            notes: notes || null,
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          });
        }
        await loadAllData();
        setConnectionStatus(true);
        render();
      } catch (e) {
        setConnectionStatus(false);
        showError('Failed to save review: ' + e.message);
      } finally {
        showLoading(false);
      }
    }

    function handleDocumentClick(event) {
      const tab = event.target.closest('[data-tab]');
      if (tab) {
        STATE.activeTab = Number(tab.dataset.tab);
        render();
        return;
      }

      const visitedBtn = event.target.closest('[data-action="mark-visited"]');
      if (visitedBtn) {
        markVisited(visitedBtn.dataset.restaurantId);
        return;
      }

      const starBtn = event.target.closest('.star-btn');
      if (starBtn) {
        const restaurantId = starBtn.dataset.restaurantId;
        const score = Number(starBtn.dataset.score);
        const mode = starBtn.dataset.mode;

        if (mode === 'desire') {
          saveDesireScore(restaurantId, score);
        } else if (mode === 'review') {
          const form = starBtn.closest('form');
          if (form) {
            form.elements.rating.value = String(score);
            const buttons = Array.from(form.querySelectorAll('.star-btn'));
            buttons.forEach(btn => {
              const active = Number(btn.dataset.score) <= score;
              btn.classList.toggle('active', active);
              btn.textContent = active ? '★' : '☆';
            });
          }
        }
      }
    }

    function bindEvents() {
      document.addEventListener('click', handleDocumentClick);
      document.addEventListener('submit', event => {
        if (event.target.matches('#add-restaurant-form')) addRestaurant(event);
        if (event.target.matches('[data-action="submit-review"]')) submitReview(event);
      });

      els.currentUser.addEventListener('change', () => {
        STATE.currentUser = els.currentUser.value;
        render();
      });

      els.refreshBtn.addEventListener('click', async () => {
        showLoading(true);
        try {
          await loadAllData();
          setConnectionStatus(true);
          render();
        } catch (e) {
          setConnectionStatus(false);
          showError('Failed to refresh: ' + e.message);
        } finally {
          showLoading(false);
        }
      });
    }

    async function init() {
      document.getElementById('app').style.display = 'none';
      const stepEl = document.getElementById('loading-step');
      if (stepEl) stepEl.textContent = 'Loading…';
      showLoading(true);
      try {
        const savedTab = Number(getSession('activeTab'));
        if ([0, 1, 2].includes(savedTab)) STATE.activeTab = savedTab;

        await loadAllData();
        const savedUser = getSession('currentUser');
        if (savedUser && STATE.users.some(u => u.name === savedUser)) STATE.currentUser = savedUser;
        if (!STATE.currentUser && STATE.users.length) STATE.currentUser = userLabel(STATE.users[0]);

        showLoading(false);
        setConnectionStatus(true);
        document.getElementById('app').style.display = 'block';
        render();
      } catch(e) {
        showFatalError(`Could not connect to database: ${e.message}`, true);
      }
    }

    bindEvents();
    init();

    setInterval(async () => {
      if (!STATE.currentUser) return;
      try {
        await loadAllData();
        setConnectionStatus(true);
        const tc = document.getElementById('tab-content');
        if (tc) tc.innerHTML = renderActiveTab();
        renderStats();
      } catch(e) {
        setConnectionStatus(false);
      }
    }, 30000);
  </script>
</body>
</html>
