<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ Restaurant Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f0f13; color: #e8e8f0; margin: 0; min-height: 100vh; }
  .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
  .glass-dark { background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); }
  .gradient-text { background: linear-gradient(135deg, #f97316, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .tab-btn { transition: all 0.2s; position: relative; }  .tab-btn.active { color: #f97316; }  .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, #f97316, #ec4899); border-radius: 2px; }  .card-hover { transition: transform 0.2s, box-shadow 0.2s; }  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(249,115,22,0.15); }  .btn-primary { background: linear-gradient(135deg, #f97316, #ec4899); border: none; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }  .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }  .btn-primary:active { transform: scale(0.98); }  .spinner { width: 48px; height: 48px; border: 4px solid rgba(249,115,22,0.2); border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; }  @keyframes spin { to { transform: rotate(360deg); } }  .star-btn { cursor: pointer; transition: transform 0.1s; font-size: 1.5rem; }  .star-btn:hover { transform: scale(1.2); }  .notification-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; position: absolute; top: 0; right: 0; }  .score-pill { padding: 2px 10px; border-radius: 9999px; font-weight: 700; font-size: 0.85rem; }  .fade-in { animation: fadeIn 0.3s ease; }  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }  .modal-bg { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }  input, textarea, select { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); color: #e8e8f0; border-radius: 8px; padding: 10px 14px; width: 100%; outline: none; transition: border-color 0.2s; }
  input:focus, textarea:focus, select:focus { border-color: #f97316; }  select option { background: #1a1a2e; }  .cuisine-badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; background: rgba(249,115,22,0.2); color: #f97316; border: 1px solid rgba(249,115,22,0.3); }  .bell-btn { position: relative; cursor: pointer; background: none; border: none; color: #e8e8f0; font-size: 1.4rem; padding: 4px; }  .notif-panel { position: absolute; right: 0; top: calc(100% + 8px); width: 320px; z-index: 100; border-radius: 12px; max-height: 400px; overflow-y: auto; }  .scroll-hide::-webkit-scrollbar { display: none; }  .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }  .locked-score { filter: blur(6px); user-select: none; cursor: default; }  .return-badge { padding: 3px 10px; border-radius: 9999px; font-size: 0.78rem; font-weight: 700; }  .return-yes { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }  .return-no { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }  .leaderboard-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,0.04); margin-bottom: 6px; }
</style>
</head>
<body>
<!-- Loading Screen --><div id="loading-screen" class="fixed inset-0 flex flex-col items-center justify-center z-50" style="background:#0f0f13;">  <div class="text-5xl mb-6">🍽️</div>  <h1 class="text-2xl font-bold gradient-text mb-8">Restaurant Tracker</h1>  <div class="spinner"></div>
</div>

<!-- Login Screen --><div id="login-screen" class="fixed inset-0 flex items-center justify-center z-40 hidden" style="background:#0f0f13;">  <div class="glass rounded-2xl p-8 w-full max-w-sm mx-4 fade-in">    <div class="text-center mb-6">      <div class="text-5xl mb-3">🍽️</div>      <h1 class="text-2xl font-bold gradient-text">Restaurant Tracker</h1>      <p class="text-gray-400 text-sm mt-1">Track your culinary adventures</p>    </div>    <div class="mb-4">      <label class="block text-sm text-gray-400 mb-1">Your Name</label>      <input id="login-name" type="text" placeholder="e.g. Alex" maxlength="30" />
    </div>    <button onclick="login()" class="btn-primary w-full py-3 rounded-xl font-bold text-white text-base">      Let's Eat! 🍴
    </button>    <p id="login-error" class="text-red-400 text-sm text-center mt-3 hidden"></p>
  </div>
</div>

<!-- Main App --><div id="app" class="hidden max-w-2xl mx-auto pb-24">

  <!-- Header -->  <header class="sticky top-0 z-30 glass-dark px-4 py-3 flex items-center justify-between" style="border-bottom:1px solid rgba(255,255,255,0.08);">    <div class="flex items-center gap-2">
      <span class="text-2xl">🍽️</span>      <span class="font-bold text-lg gradient-text">Restaurant Tracker</span>
    </div>    <div class="flex items-center gap-3">      <span class="text-sm text-gray-400">Hey, <span id="header-username" class="text-orange-400 font-semibold"></span></span>      <div class="relative">        <button class="bell-btn" onclick="toggleNotifications()" id="bell-btn">🔔</button>        <div id="notif-dot" class="notification-dot hidden"></div>        <div id="notif-panel" class="notif-panel glass-dark hidden">          <div class="p-3 border-b border-white/10 flex items-center justify-between">            <span class="font-semibold text-sm">Notifications</span>            <button onclick="clearNotifications()" class="text-xs text-gray-400 hover:text-orange-400">Clear all</button>
          </div>          <div id="notif-list" class="p-2"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Tabs -->  <div class="glass-dark sticky top-[57px] z-20 px-4 flex gap-6 border-b" style="border-color:rgba(255,255,255,0.08);">    <button class="tab-btn py-3 text-sm font-semibold text-gray-400 active" onclick="switchTab(0)" id="tab-0">🗂 Wishlist</button>    <button class="tab-btn py-3 text-sm font-semibold text-gray-400" onclick="switchTab(1)" id="tab-1">⏳ Pending</button>    <button class="tab-btn py-3 text-sm font-semibold text-gray-400" onclick="switchTab(2)" id="tab-2">✅ Reviewed</button>    <button class="tab-btn py-3 text-sm font-semibold text-gray-400" onclick="switchTab(3)" id="tab-3">↩️ We'd Return</button>    <button class="tab-btn py-3 text-sm font-semibold text-gray-400" onclick="switchTab(4)" id="tab-4">🏆 Leaders</button>
  </div>

  <!-- Tab Content -->  <main class="px-4 py-4">    <div id="tab-content-0" class="tab-content fade-in"></div>    <div id="tab-content-1" class="tab-content hidden fade-in"></div>
    <div id="tab-content-2" class="tab-content hidden fade-in"></div>    <div id="tab-content-3" class="tab-content hidden fade-in"></div>    <div id="tab-content-4" class="tab-content hidden fade-in"></div>
  </main>
</div>

<!-- Add Restaurant Modal --><div id="add-modal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center hidden">  <div class="glass rounded-2xl p-6 w-full max-w-sm mx-4 fade-in">
    <h2 class="text-lg font-bold mb-4">➕ Add to Wishlist</h2>    <div class="mb-3">      <label class="block text-sm text-gray-400 mb-1">Restaurant Name *</label>      <input id="add-name" type="text" placeholder="e.g. Nobu London" maxlength="80" />
    </div>
    <div class="mb-3">
      <label class="block text-sm text-gray-400 mb-1">Cuisine *</label>      <input id="add-cuisine" type="text" placeholder="e.g. Japanese" maxlength="50" />
    </div>
    <div class="mb-3">      <label class="block text-sm text-gray-400 mb-1">Location</label>      <input id="add-location" type="text" placeholder="e.g. Mayfair, London" maxlength="100" />    </div>    <div class="mb-3">
      <label class="block text-sm text-gray-400 mb-1">Notes</label>      <textarea id="add-notes" placeholder="Why you want to go..." rows="2" style="resize:none;"></textarea>
    </div>    <div class="mb-4">      <label class="block text-sm text-gray-400 mb-1">Desire Score (1-10)</label>      <div id="desire-stars" class="flex gap-1"></div>      <input id="add-desire" type="hidden" value="5" />    </div>    <div class="flex gap-2">      <button onclick="closeAddModal()" class="flex-1 py-2 rounded-xl border border-white/20 text-gray-300 hover:bg-white/5 transition">Cancel</button>      <button onclick="addRestaurant()" class="btn-primary flex-1 py-2 rounded-xl font-bold text-white">Add!</button>
    </div>    <p id="add-error" class="text-red-400 text-sm mt-2 hidden"></p>
  </div>
</div>

<!-- Review Modal --><div id="review-modal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center hidden">  <div class="glass rounded-2xl p-6 w-full max-w-sm mx-4 fade-in scroll-hide" style="max-height:90vh;overflow-y:auto;">
    <h2 class="text-lg font-bold mb-1">📝 Write Your Review</h2>    <p id="review-restaurant-name" class="text-orange-400 font-semibold mb-4"></p>    <input type="hidden" id="review-restaurant-id" />

    <div class="mb-3">      <label class="block text-sm text-gray-400 mb-1">Food Score (1-10)</label>      <div id="food-stars" class="flex gap-1"></div>
      <input id="review-food" type="hidden" value="5" />
    </div>    <div class="mb-3">      <label class="block text-sm text-gray-400 mb-1">Vibe Score (1-10)</label>      <div id="vibe-stars" class="flex gap-1"></div>      <input id="review-vibe" type="hidden" value="5" />
    </div>    <div class="mb-3">      <label class="block text-sm text-gray-400 mb-1">Service Score (1-10)</label>      <div id="service-stars" class="flex gap-1"></div>      <input id="review-service" type="hidden" value="5" />    </div>    <div class="mb-3">      <label class="block text-sm text-gray-400 mb-1">Value Score (1-10)</label>      <div id="value-stars" class="flex gap-1"></div>
      <input id="review-value" type="hidden" value="5" />
    </div>    <div class="mb-3">      <label class="block text-sm text-gray-400 mb-1">Would you return?</label>      <div class="flex gap-2">        <button id="return-yes-btn" onclick="setReturn(true)" class="flex-1 py-2 rounded-xl border border-white/20 text-sm transition hover:bg-green-500/20">👍 Yes</button>        <button id="return-no-btn" onclick="setReturn(false)" class="flex-1 py-2 rounded-xl border border-white/20 text-sm transition hover:bg-red-500/20">👎 No</button>
      </div>      <input id="review-return" type="hidden" value="" />
    </div>    <div class="mb-4">      <label class="block text-sm text-gray-400 mb-1">Comments</label>      <textarea id="review-comments" placeholder="What did you think?" rows="3" style="resize:none;"></textarea>
    </div>
    <div class="flex gap-2">      <button onclick="closeReviewModal()" class="flex-1 py-2 rounded-xl border border-white/20 text-gray-300 hover:bg-white/5 transition">Cancel</button>      <button onclick="submitReview()" class="btn-primary flex-1 py-2 rounded-xl font-bold text-white">Submit!</button>
    </div>
    <p id="review-error" class="text-red-400 text-sm mt-2 hidden"></p>
  </div>
</div>

<script>const SUPA_URL = 'https://oofjwdtcasmderyduzki.supabase.co';const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vZmp3ZHRjYXNtZGVyeWR1emtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTQ3OTgsImV4cCI6MjEwNDk3MDc5OH0.H18m3Ooip-At6jZlIngac26EB5_cL2LMLwEIX7csHkY';
// ── Supabase REST helpers ──────────────────────────────────────────────────────async function sbSelect(table, params = '') {  const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, {    headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' }
  });  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return r.json();
}

async function sbInsert(table, data) {  const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {    method: 'POST',    headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify(data)
  });  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return r.json();
}
async function sbUpdate(table, match, data) {  const params = Object.entries(match).map(([k,v]) => `${k}=eq.${v}`).join('&');  const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, {
    method: 'PATCH',    headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify(data)
  });  if (!r.ok) { const e = await r.text(); throw new Error(e); }  return r.json();
}
async function sbDelete(table, match) {
  const params = Object.entries(match).map(([k,v]) => `${k}=eq.${v}`).join('&');  const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, {    method: 'DELETE',    headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' }
  });  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return true;
}
// ── UUID ──────────────────────────────────────────────────────────────────────function uuid() {  return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}
// ── App State ─────────────────────────────────────────────────────────────────let currentUser = null;let wishlist = [];let pendingReviews = [];let reviews = [];let desireScores = [];
let notifications = [];let currentTab = 0;
// ── Init ──────────────────────────────────────────────────────────────────────window.addEventListener('DOMContentLoaded', async () => {  const savedUser = localStorage.getItem('rt_user');
  if (savedUser) {    currentUser = savedUser;    await loadAllData();    showApp();
  } else {    hideLoading();
    showLogin();
  }});
function hideLoading() {
  document.getElementById('loading-screen').classList.add('hidden');
}

function showLogin() {
  document.getElementById('login-screen').classList.remove('hidden');}

function showApp() {  hideLoading();  document.getElementById('login-screen').classList.add('hidden');  document.getElementById('app').classList.remove('hidden');  document.getElementById('header-username').textContent = currentUser;
  renderAll();  checkNotifications();
}
async function login() {  const name = document.getElementById('login-name').value.trim();  const err = document.getElementById('login-error');
  if (!name) { err.textContent = 'Please enter your name'; err.classList.remove('hidden'); return; }  err.classList.add('hidden');
  currentUser = name;  localStorage.setItem('rt_user', name);
  await loadAllData();
  showApp();
}

// ── Data Loading ──────────────────────────────────────────────────────────────async function loadAllData() {  try {
    const [w, pr, r, ds] = await Promise.all([      sbSelect('wishlist', 'order=created_at.desc'),      sbSelect('pending_reviews', 'order=visited_at.desc'),
      sbSelect('reviews', 'order=created_at.desc'),      sbSelect('desire_scores', '')
    ]);    wishlist = w || [];
    pendingReviews = pr || [];
    reviews = r || [];
    desireScores = ds || [];  } catch(e) {    console.error('Load error:', e);    wishlist = []; pendingReviews = []; reviews = []; desireScores = [];
  }}
// ── Notifications ─────────────────────────────────────────────────────────────
function checkNotifications() {
  notifications = [];  // Check for pending restaurants that need review  const myPending = pendingReviews.filter(pr => {    const myReview = reviews.find(r => r.restaurant_id === pr.id && r.reviewer === currentUser);    return !myReview;
  });  myPending.forEach(pr => {    notifications.push({ id: pr.id, msg: `You haven't reviewed "${pr.name}" yet!`, type: 'review' });
  });  // Check if partner submitted and you haven't
  const dot = document.getElementById('notif-dot');  if (notifications.length > 0) dot.classList.remove('hidden');
  else dot.classList.add('hidden');
}

function toggleNotifications() {  const panel = document.getElementById('notif-panel');
  panel.classList.toggle('hidden');
  renderNotifications();
}

function renderNotifications() {  const list = document.getElementById('notif-list');  if (notifications.length === 0) {    list.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">All caught up! 🎉</p>';
    return;
  }
  list.innerHTML = notifications.map(n => `    <div class="flex items-start gap-2 p-2 rounded-lg hover:bg-white/5 mb-1">      <span class="text-lg">${n.type === 'review' ? '📝' : '🔔'}</span>
      <span class="text-sm text-gray-300">${escHtml(n.msg)}</span>
    </div>  `).join('');
}

function clearNotifications() {
  notifications = [];
  document.getElementById('notif-dot').classList.add('hidden');
  renderNotifications();
}
// Close notifications when clicking outside
document.addEventListener('click', (e) => {
  const panel = document.getElementById('notif-panel');  const btn = document.getElementById('bell-btn');
  if (!panel.contains(e.target) && e.target !== btn) {    panel.classList.add('hidden');
  }
});
// ── Tab Switching ─────────────────────────────────────────────────────────────function switchTab(idx) {
  currentTab = idx;  document.querySelectorAll('.tab-btn').forEach((b, i) => {    b.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.tab-content').forEach((c, i) => {    c.classList.toggle('hidden', i !== idx);    if (i === idx) { c.classList.remove('hidden'); c.classList.add('fade-in'); }  });  renderTab(idx);
}

function renderAll() {  for (let i = 0; i < 5; i++) renderTab(i);
}

function renderTab(idx) {
  switch(idx) {    case 0: renderWishlist(); break;    case 1: renderPending(); break;    case 2: renderReviewed(); break;    case 3: renderWedReturn(); break;    case 4: renderLeaderboard(); break;  }
}
// ── Helpers ───────────────────────────────────────────────────────────────────function escHtml(s) {  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function avgScore(restaurantId) {  const rs = reviews.filter(r => r.restaurant_id === restaurantId);  if (!rs.length) return null;  const totals = rs.map(r => ((r.food||0)+(r.vibe||0)+(r.service||0)+(r.value||0))/4);
  return (totals.reduce((a,b)=>a+b,0)/totals.length).toFixed(1);
}
function scoreColor(s) {  if (s >= 8) return '#4ade80';
  if (s >= 6) return '#facc15';
  return '#f87171';
}

function getDesireScore(restaurantId, user) {
  const ds = desireScores.find(d => d.restaurant_id === restaurantId && d.user_name === user);
  return ds ? ds.score : 0;
}

function getAvgDesire(restaurantId) {
  const scores = desireScores.filter(d => d.restaurant_id === restaurantId);
  if (!scores.length) return 0;
  return (scores.reduce((a,b) => a + b.score, 0) / scores.length).toFixed(1);
}

// ── Wishlist Tab ──────────────────────────────────────────────────────────────
function renderWishlist() {
  const container = document.getElementById('tab-content-0');
  let html = `
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold">🗂 Wishlist <span class="text-gray-500 text-base font-normal">(${wishlist.length})</span></h2>
      <button onclick="openAddModal()" class="btn-primary px-4 py-2 rounded-xl font-bold text-white text-sm">+ Add</button>
    </div>
  `;  if (!wishlist.length) {    html += `<div class="text-center py-16 text-gray-500">      <div class="text-5xl mb-3">🍴</div>      <p class="text-lg">No restaurants yet!</p>      <p class="text-sm mt-1">Add somewhere you want to try.</p>    </div>`;
  } else {    html += wishlist.map(r => renderWishlistCard(r)).join('');
  }
  container.innerHTML = html;
}

function renderWishlistCard(r) {  const myDesire = getDesireScore(r.id, currentUser);  const avgDesire = getAvgDesire(r.id);
  return `    <div class="glass rounded-2xl p-4 mb-3 card-hover">
      <div class="flex items-start justify-between mb-2">        <div class="flex-1 min-w-0">          <h3 class="font-bold text-base truncate">${escHtml(r.name)}</h3>          ${r.location ? `<p class="text-gray-400 text-xs mt-0.5">📍 ${escHtml(r.location)}</p>` : ''}
        </div>        <span class="cuisine-badge ml-2 flex-shrink-0">${escHtml(r.cuisine)}</span>
      </div>      ${r.notes ? `<p class="text-gray-400 text-sm mb-2 italic">"${escHtml(r.notes)}"</p>` : ''}
      <div class="flex items-center gap-2 mb-3">        <span class="text-xs text-gray-500">Your desire:</span>        <div class="flex gap-0.5">${renderMiniStars(myDesire, r.id)}</div>        ${avgDesire > 0 ? `<span class="text-xs text-orange-400 ml-1">avg ${avgDesire}</span>` : ''}
      </div>
      <div class="flex gap-2">        <button onclick="markVisited('${r.id}')" class="btn-primary flex-1 py-1.5 rounded-lg text-sm font-semibold text-white">          ✅ Mark Visited        </button>        <button onclick="deleteWishlist('${r.id}')" class="py-1.5 px-3 rounded-lg border border-white/15 text-gray-400 hover:text-red-400 hover:border-red-400/40 text-sm transition">
          🗑
        </button>      </div>
    </div>  `;
}
function renderMiniStars(current, restaurantId) {  let html = '';
  for (let i = 1; i <= 10; i++) {    const filled = i <= current;    html += `<span onclick="setDesireScore('${restaurantId}', ${i})" style="cursor:pointer;font-size:0.85rem;opacity:${filled?1:0.25};">⭐</span>`;  }
  return html;}
async function setDesireScore(restaurantId, score) {  try {    const existing = desireScores.find(d => d.restaurant_id === restaurantId && d.user_name === currentUser);    if (existing) {      await sbUpdate('desire_scores', { id: existing.id }, { score });    } else {      await sbInsert('desire_scores', { id: uuid(), restaurant_id: restaurantId, user_name: currentUser, score });    }    await loadAllData();    renderWishlist();  } catch(e) { console.error(e); }
}
async function deleteWishlist(id) {  if (!confirm('Remove from wishlist?')) return;  try {    await sbDelete('desire_scores', { restaurant_id: id });    await sbDelete('wishlist', { id });    await loadAllData();    renderWishlist();  } catch(e) { console.error(e); }
}
// ── markVisited FIX ───────────────────────────────────────────────────────────async function markVisited(restaurantId) {  const r = wishlist.find(w => w.id === restaurantId);  if (!r) return;  try {    // a. Generate a new uuid for pending_reviews    const pendingId = uuid();    // b. Insert into pending_reviews with its own id, restaurant_id = wishlist id    await sbInsert('pending_reviews', {
      id: pendingId,
      restaurant_id: restaurantId,
      name: r.name,
      cuisine: r.cuisine,      visited_at: new Date().toISOString()
    });    // c. Delete desire_scores for this wishlist item    await sbDelete('desire_scores', { restaurant_id: restaurantId });    // d. Delete from wishlist
    await sbDelete('wishlist', { id: restaurantId });
    // e. Reload all data
    await loadAllData();    // f. Switch to pending tab
    switchTab(1);
  } catch(e) {    console.error('markVisited error:', e);    alert('Error marking as visited: ' + e.message);
  }
}
// ── Add Modal ─────────────────────────────────────────────────────────────────
function openAddModal() {  document.getElementById('add-name').value = '';  document.getElementById('add-cuisine').value = '';
  document.getElementById('add-location').value = '';
  document.getElementById('add-notes').value = '';
  document.getElementById('add-desire').value = '5';  document.getElementById('add-error').classList.add('hidden');
  renderDesireStars(5);
  document.getElementById('add-modal').classList.remove('hidden');  setTimeout(() => document.getElementById('add-name').focus(), 100);
}
function closeAddModal() {  document.getElementById('add-modal').classList.add('hidden');
}
function renderDesireStars(current) {  const container = document.getElementById('desire-stars');  let html = '';  for (let i = 1; i <= 10; i++) {    html += `<span class="star-btn" onclick="selectDesireStar(${i})" style="opacity:${i<=current?1:0.25};">⭐</span>`;
  }
  container.innerHTML = html;
}
function selectDesireStar(val) {  document.getElementById('add-desire').value = val;
  renderDesireStars(val);
}
async function addRestaurant() {
  const name = document.getElementById('add-name').value.trim();  const cuisine = document.getElementById('add-cuisine').value.trim();
  const location = document.getElementById('add-location').value.trim();  const notes = document.getElementById('add-notes').value.trim();  const desire = parseInt(document.getElementById('add-desire').value) || 5;  const err = document.getElementById('add-error');
  if (!name) { err.textContent = 'Name is required'; err.classList.remove('hidden'); return; }  if (!cuisine) { err.textContent = 'Cuisine is required'; err.classList.remove('hidden'); return; }
  err.classList.add('hidden');

  try {
    const wid = uuid();    await sbInsert('wishlist', { id: wid, name, cuisine, location, notes, created_at: new Date().toISOString() });    if (desire > 0) {      await sbInsert('desire_scores', { id: uuid(), restaurant_id: wid, user_name: currentUser, score: desire });
    }    await loadAllData();    closeAddModal();
    renderWishlist();  } catch(e) {
    err.textContent = 'Error: ' + e.message;    err.classList.remove('hidden');
  }
}
// ── Pending Tab ───────────────────────────────────────────────────────────────function renderPending() {  const container = document.getElementById('tab-content-1');  const pending = getPendingOnly();  let html = `    <div class="flex items-center justify-between mb-4">      <h2 class="text-xl font-bold">⏳ Pending Reviews <span class="text-gray-500 text-base font-normal">(${pending.length})</span></h2>    </div>
  `;  if (!pending.length) {
    html += `<div class="text-center py-16 text-gray-500">      <div class="text-5xl mb-3">⏳</div>
      <p class="text-lg">No pending reviews!</p>
      <p class="text-sm mt-1">Mark a restaurant as visited to review it.</p>    </div>`;  } else {
    html += pending.map(pr => renderPendingCard(pr)).join('');
  }
  container.innerHTML = html;
}

function getPendingOnly() {  // Returns pending_reviews that don't have reviews from BOTH users  return pendingReviews.filter(pr => {    const reviewsForThis = reviews.filter(r => r.restaurant_id === pr.id);    // Still pending if current user hasn't reviewed OR not fully complete    return reviewsForThis.length < 2;
  });
}
function renderPendingCard(pr) {  const myReview = reviews.find(r => r.restaurant_id === pr.id && r.reviewer === currentUser);  const allReviewsForThis = reviews.filter(r => r.restaurant_id === pr.id);  const visitedDate = pr.visited_at ? new Date(pr.visited_at).toLocaleDateString() : '';

  return `
    <div class="glass rounded-2xl p-4 mb-3 card-hover">      <div class="flex items-start justify-between mb-2">        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-base truncate">${escHtml(pr.name)}</h3>          ${visitedDate ? `<p class="text-gray-400 text-xs mt-0.5">📅 Visited ${visitedDate}</p>` : ''}
        </div>        <span class="cuisine-badge ml-2 flex-shrink-0">${escHtml(pr.cuisine || '')}</span>
      </div>      <div class="flex items-center gap-2 mb-3">        ${allReviewsForThis.map(rv => `          <span class="text-xs px-2 py-1 rounded-full" style="background:rgba(249,115,22,0.15);color:#f97316;">
            ✓ ${escHtml(rv.reviewer)}
          </span>        `).join('')}        ${allReviewsForThis.length === 0 ? '<span class="text-xs text-gray-500">No reviews yet</span>' : ''}
      </div>      ${myReview        ? `<div class="text-sm text-green-400 py-1">✅ You've submitted your review!</div>`        : `<button onclick="openReviewModal('${pr.id}', '${escHtml(pr.name).replace(/'/g,"\\'")}' )" class="btn-primary w-full py-2 rounded-xl font-bold text-white text-sm">             📝 Write Review
           </button>`      }
    </div>  `;
}
// ── Review Modal ──────────────────────────────────────────────────────────────function openReviewModal(restaurantId, name) {  document.getElementById('review-restaurant-id').value = restaurantId;  document.getElementById('review-restaurant-name').textContent = name;  document.getElementById('review-food').value = '5';  document.getElementById('review-vibe').value = '5';  document.getElementById('review-service').value = '5';  document.getElementById('review-value').value = '5';  document.getElementById('review-return').value = '';  document.getElementById('review-comments').value = '';  document.getElementById('review-error').classList.add('hidden');  renderReviewStars('food', 5);  renderReviewStars('vibe', 5);  renderReviewStars('service', 5);  renderReviewStars('value', 5);
  setReturn(null);  document.getElementById('review-modal').classList.remove('hidden');
}

function closeReviewModal() {  document.getElementById('review-modal').classList.add('hidden');
}
function renderReviewStars(field, current) {  const container = document.getElementById(`${field}-stars`);
  let html = '';  for (let i = 1; i <= 10; i++) {    html += `<span class="star-btn" onclick="selectReviewStar('${field}', ${i})" style="font-size:1.2rem;opacity:${i<=current?1:0.25};">⭐</span>`;
  }  container.innerHTML = html;
}
function selectReviewStar(field, val) {
  document.getElementById(`review-${field}`).value = val;  renderReviewStars(field, val);}
function setReturn(val) {  document.getElementById('review-return').value = val === null ? '' : (val ? 'true' : 'false');  const yBtn = document.getElementById('return-yes-btn');
  const nBtn = document.getElementById('return-no-btn');  yBtn.style.background = val === true ? 'rgba(34,197,94,0.3)' : '';
  yBtn.style.borderColor = val === true ? 'rgba(34,197,94,0.6)' : '';  nBtn.style.background = val === false ? 'rgba(239,68,68,0.3)' : '';
  nBtn.style.borderColor = val === false ? 'rgba(239,68,68,0.6)' : '';
}

// ── submitReview FIX ──────────────────────────────────────────────────────────async function submitReview() {  // restaurantId here IS the pending_reviews.id (pendingId)
  const restaurantId = document.getElementById('review-restaurant-id').value;  const food = parseInt(document.getElementById('review-food').value) || 5;  const vibe = parseInt(document.getElementById('review-vibe').value) || 5;  const service = parseInt(document.getElementById('review-service').value) || 5;  const value = parseInt(document.getElementById('review-value').value) || 5;
  const returnVal = document.getElementById('review-return').value;  const comments = document.getElementById('review-comments').value.trim();  const err = document.getElementById('review-error');
  if (!returnVal) { err.textContent = 'Please select if you would return'; err.classList.remove('hidden'); return; }  err.classList.add('hidden');

  try {
    // Insert review with restaurant_id = pending_reviews.id    await sbInsert('reviews', {      id: uuid(),
      restaurant_id: restaurantId,
      reviewer: currentUser,
      food,
      vibe,
      service,
      value,
      would_return: returnVal === 'true',      comments,
      created_at: new Date().toISOString()    });
    await loadAllData();
    closeReviewModal();
    checkNotifications();    renderAll();  } catch(e) {
    err.textContent = 'Error: ' + e.message;
    err.classList.remove('hidden');
  }
}
// ── Reviewed Tab ──────────────────────────────────────────────────────────────
function renderReviewed() {  const container = document.getElementById('tab-content-2');
  const completed = getCompletedRestaurants();
  let html = `    <div class="flex items-center justify-between mb-4">      <h2 class="text-xl font-bold">✅ Reviewed <span class="text-gray-500 text-base font-normal">(${completed.length})</span></h2>
    </div>
  `;  if (!completed.length) {
    html += `<div class="text-center py-16 text-gray-500">      <div class="text-5xl mb-3">✅</div>      <p class="text-lg">No completed reviews yet!</p>      <p class="text-sm mt-1">Both users need to review a restaurant.</p>    </div>`;
  } else {
    html += completed.map(item => renderReviewedCard(item)).join('');
  }
  container.innerHTML = html;
}

function getCompletedRestaurants() {  // A restaurant is "completed" when it has reviews from at least 2 different reviewers  return pendingReviews.filter(pr => {    const rs = reviews.filter(r => r.restaurant_id === pr.id);    const uniqueReviewers = [...new Set(rs.map(r => r.reviewer))];    return uniqueReviewers.length >= 2;
  }).map(pr => {
    const rs = reviews.filter(r => r.restaurant_id === pr.id);    return { pr, reviews: rs };
  });}

function renderReviewedCard(item) {  const { pr, reviews: rs } = item;  const myReview = rs.find(r => r.reviewer === currentUser);  const bothReviewed = rs.length >= 2;

  return `    <div class="glass rounded-2xl p-4 mb-3 card-hover">
      <div class="flex items-start justify-between mb-2">        <div class="flex-1 min-w-0">          <h3 class="font-bold text-base truncate">${escHtml(pr.name)}</h3>          ${pr.visited_at ? `<p class="text-gray-400 text-xs mt-0.5">📅 ${new Date(pr.visited_at).toLocaleDateString()}</p>` : ''}
        </div>
        <span class="cuisine-badge ml-2 flex-shrink-0">${escHtml(pr.cuisine || '')}</span>      </div>      <div class="space-y-2">
        ${rs.map(rv => {          const avg = ((rv.food + rv.vibe + rv.service + rv.value) / 4).toFixed(1);
          const color = scoreColor(avg);
          const isMe = rv.reviewer === currentUser;          const show = bothReviewed || isMe;
          return `            <div class="flex items-center gap-2 py-2 border-t border-white/5">              <span class="text-sm font-semibold ${isMe ? 'text-orange-400' : 'text-purple-400'} w-20 flex-shrink-0">                ${escHtml(rv.reviewer)}${isMe ? ' (you)' : ''}
              </span>              <div class="flex-1 flex gap-2 flex-wrap">                ${show ? `                  <span class="score-pill" style="background:${color}22;color:${color};border:1px solid ${color}44;">                    ⭐ ${avg}
                  </span>                  <span class="text-xs text-gray-500">🍴${rv.food} 🎭${rv.vibe} 💁${rv.service} 💰${rv.value}</span>                ` : `                  <span class="locked-score score-pill" style="background:rgba(255,255,255,0.1);color:white;">                    ⭐ ??.?
                  </span>                  <span class="text-xs text-gray-500 italic">Revealed when both reviewed</span>
                `}
              </div>              ${rv.would_return !== undefined && rv.would_return !== null                ? `<span class="return-badge ${rv.would_return ? 'return-yes' : 'return-no'}">${rv.would_return ? '↩ Yes' : '✗ No'}</span>`                : ''
              }            </div>
          `;
        }).join('')}      </div>      ${rs.some(rv => rv.comments) ? `        <div class="mt-2 border-t border-white/5 pt-2">          ${rs.filter(rv => rv.comments).map(rv => `            <p class="text-xs text-gray-400 italic mt-1">"${escHtml(rv.comments)}" — <span class="text-orange-400">${escHtml(rv.reviewer)}</span></p>
          `).join('')}
        </div>      ` : ''}
    </div>
  `;
}
// ── We'd Return Tab ───────────────────────────────────────────────────────────
function renderWedReturn() {  const container = document.getElementById('tab-content-3');  const completed = getCompletedRestaurants();  const wouldReturn = completed.filter(item => {    return item.reviews.every(rv => rv.would_return === true);
  });
  const wouldNotReturn = completed.filter(item => {    return item.reviews.some(rv => rv.would_return === false);  });
  let html = `<h2 class="text-xl font-bold mb-4">↩️ We'd Return</h2>`;

  if (!completed.length) {
    html += `<div class="text-center py-16 text-gray-500">      <div class="text-5xl mb-3">↩️</div>      <p class="text-lg">No completed reviews yet!</p>    </div>`;  } else {    if (wouldReturn.length) {      html += `<h3 class="text-green-400 font-semibold text-sm mb-2 uppercase tracking-wide">✅ Both Would Return (${wouldReturn.length})</h3>`;      html += wouldReturn.map(item => renderReturnCard(item, true)).join('');
    }
    if (wouldNotReturn.length) {      html += `<h3 class="text-red-400 font-semibold text-sm mb-2 mt-4 uppercase tracking-wide">❌ Wouldn't Return (${wouldNotReturn.length})</h3>`;      html += wouldNotReturn.map(item => renderReturnCard(item, false)).join('');
    }    if (!wouldReturn.length && !wouldNotReturn.length) {      html += `<div class="text-center py-8 text-gray-500"><p>No unanimous decisions yet.</p></div>`;
    }
  }
  container.innerHTML = html;}
function renderReturnCard(item, returning) {
  const { pr, reviews: rs } = item;
  const avg = avgScore(pr.id);  const color = avg ? scoreColor(parseFloat(avg)) : '#888';  return `    <div class="glass rounded-2xl p-4 mb-3 card-hover">      <div class="flex items-center justify-between">
        <div class="flex-1 min-w-0">          <h3 class="font-bold text-base truncate">${escHtml(pr.name)}</h3>          <span class="cuisine-badge mt-1">${escHtml(pr.cuisine || '')}</span>        </div>        <div class="flex flex-col items-end gap-1 ml-3">          ${avg ? `<span class="score-pill" style="background:${color}22;color:${color};border:1px solid ${color}44;">⭐ ${avg}</span>` : ''}          <span class="return-badge ${returning ? 'return-yes' : 'return-no'}">${returning ? '↩ Return' : '✗ No Return'}</span>
        </div>
      </div>    </div>  `;
}
// ── Leaderboard Tab ───────────────────────────────────────────────────────────
function renderLeaderboard() {  const container = document.getElementById('tab-content-4');  const completed = getCompletedRestaurants();
  if (!completed.length) {    container.innerHTML = `      <h2 class="text-xl font-bold mb-4">🏆 Leaderboards</h2>      <div class="text-center py-16 text-gray-500">        <div class="text-5xl mb-3">🏆</div>        <p class="text-lg">No data yet!</p>        <p class="text-sm mt-1">Complete some reviews to see rankings.</p>      </div>
    `;    return;
  }
  // Compute average scores for each restaurant  const scored = completed.map(item => {    const score = parseFloat(avgScore(item.pr.id)) || 0;
    return { ...item, avgScore: score };
  }).sort((a, b) => b.avgScore - a.avgScore);
  // Top by cuisine
  const byCuisine = {};
  completed.forEach(item => {    const c = item.pr.cuisine || 'Other';    if (!byCuisine[c]) byCuisine[c] = [];    byCuisine[c].push({ ...item, avgScore: parseFloat(avgScore(item.pr.id)) || 0 });
  });

  let html = `<h2 class="text-xl font-bold mb-4">🏆 Leaderboards</h2>`;
  // Top restaurants  html += `<h3 class="text-orange-400 font-semibold text-sm mb-2 uppercase tracking-wide">🥇 Top Rated</h3>`;  html += `<div class="glass rounded-2xl p-3 mb-4">`;  scored.slice(0, 10).forEach((item, idx) => {    const color = scoreColor(item.avgScore);
    const medals = ['🥇','🥈','🥉'];    html += `      <div class="leaderboard-item">        <span class="text-xl">${medals[idx] || `#${idx+1}`}</span>
        <div class="flex-1 min-w-0">          <p class="font-semibold text-sm truncate">${escHtml(item.pr.name)}</p>
          <p class="text-xs text-gray-500">${escHtml(item.pr.cuisine || '')}</p>
        </div>        <span class="score-pill" style="background:${color}22;color:${color};border:1px solid ${color}44;">⭐ ${item.avgScore.toFixed(1)}</span>
      </div>
    `;
  });
  html += `</div>`;
  // Most visited cuisine  html += `<h3 class="text-purple-400 font-semibold text-sm mb-2 uppercase tracking-wide">🍜 By Cuisine</h3>`;
  html += `<div class="glass rounded-2xl p-3 mb-4">`;  const cuisineEntries = Object.entries(byCuisine).sort((a,b) => {    const aAvg = a[1].reduce((x,y) => x + y.avgScore, 0) / a[1].length;    const bAvg = b[1].reduce((x,y) => x + y.avgScore, 0) / b[1].length;    return bAvg - aAvg;  });
  cuisineEntries.forEach(([cuisine, items]) => {    const avg = (items.reduce((a,b) => a + b.avgScore, 0) / items.length).toFixed(1);    const color = scoreColor(parseFloat(avg));    html += `      <div class="leaderboard-item">        <span class="text-xl">🍽️</span>
        <div class="flex-1">          <p class="font-semibold text-sm">${escHtml(cuisine)}</p>          <p class="text-xs text-gray-500">${items.length} restaurant${items.length !== 1 ? 's' : ''}</p>
        </div>        <span class="score-pill" style="background:${color}22;color:${color};border:1px solid ${color}44;">⭐ ${avg}</span>
      </div>    `;
  });  html += `</div>`;
  // Reviewer stats  html += `<h3 class="text-blue-400 font-semibold text-sm mb-2 uppercase tracking-wide">👤 Reviewer Stats</h3>`;  const reviewerMap = {};
  reviews.forEach(rv => {    if (!reviewerMap[rv.reviewer]) reviewerMap[rv.reviewer] = { total: 0, count: 0, returns: 0 };    reviewerMap[rv.reviewer].total += (rv.food + rv.vibe + rv.service + rv.value) / 4;
    reviewerMap[rv.reviewer].count++;
    if (rv.would_return) reviewerMap[rv.reviewer].returns++;
  });  html += `<div class="glass rounded-2xl p-3">`;
  Object.entries(reviewerMap).forEach(([name, stats]) => {
    const avg = (stats.total / stats.count).toFixed(1);    const color = scoreColor(parseFloat(avg));
    html += `
      <div class="leaderboard-item">        <span class="text-xl">${name === currentUser ? '😊' : '👤'}</span>
        <div class="flex-1">          <p class="font-semibold text-sm">${escHtml(name)}${name === currentUser ? ' (you)' : ''}</p>          <p class="text-xs text-gray-500">${stats.count} review${stats.count !== 1 ? 's' : ''} · ${stats.returns} returns</p>        </div>        <span class="score-pill" style="background:${color}22;color:${color};border:1px solid ${color}44;">⭐ ${avg}</span>
      </div>
    `;
  });  html += `</div>`;
  container.innerHTML = html;
}

document.addEventListener('keydown', e => {  if (e.key === 'Escape') {    closeAddModal();    closeReviewModal();  }  if (e.key === 'Enter' && !document.getElementById('add-modal').classList.contains('hidden')) {    addRestaurant();  }});
