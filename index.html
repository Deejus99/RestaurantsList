
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ Restaurant Tracker</title>
<style>
  *, *::before,  NOTIFICATIONS */
  .notif-bell-wrap { position: relative; }
  .notif-bell { font-size: 1.3rem; cursor: pointer; padding: 4px; }
  .notif-badge { position: absolute; top: -2px; right: -4px; background: #ef4444; color: white; border-radius: 50%; font-size: 0.6rem; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .notif-dropdown { position: absolute; right: 0; top: 36px; width: 300px; background: white; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.15); z-index: 999; max-height: 360px; overflow-y: auto; }
  .notif-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .notif-item { padding: 10px 14px; border-bottom: 1px solid #f5f5f5; font-size: 0.8rem; }
  .notif-item.unread { background: #fffbeb; }
  .notif-time { font-size: 0.7rem; color: var(--text-light); margin-top: 2px; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner" id="loading-spinner"></div>
  <div id="loading-step">Loading…</div>
</div>

<div id="status-indicator">🟢 Connected</div>
<div id="error-toast"></div>
<div id="app" style="display:none;"></div>

<script>
const SUPA_URL = ' SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vZmp3ZHRjYXNtZGVyeWR1emtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTQ3OTgsImV4cCI6MjEwNDk3MDc5OH0.H18m3Ooip-At6jZlIngac26EB5_cL2LMLwEIX7csHkY';
const SUPA_REST = SUPA_URL + '/rest/v1/';

const STATE = {
  currentUser: null, users: [], wishlist: [], desireScores: [],
  pendingReviews: [], reviews: [], activeTab: 0, loginSelectedUser: null
};

function getSession(k) { try { return sessionStorage.getItem(k); } catch(e) { return null; } }
function setSession(k, v) { try { sessionStorage.setItem(k, v); } catch(e) {} }
function clearSession(k) { try { sessionStorage.removeItem(k); } catch(e) {} }

async function dbGet(table, query) {
  const url = SUPA_REST + table + (query ? '?' + query : '');
  const res = await fetch(url, { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY } });
  const body = await res.text();
  if (!res.ok) throw new Error('GET ' + table + ' failed: ' + res.status + ' — ' + body);
  return JSON.parse(body);
}

async function dbInsert(table, data) {
  const url = SUPA_REST + table;
  const res = await fetch(url, { method: 'POST', headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }, body: JSON.stringify(data) });
  const body = await res.text();
  if (!res.ok) throw new Error('INSERT ' + table + ' failed: ' + res.status + ' — ' + body);
  return JSON.parse(body);
}

async function dbUpdate(table, query, data) {
  const url = SUPA_REST + table + '?' + query;
  const res = await fetch(url, { method: 'PATCH', headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }, body: JSON.stringify(data) });
  const body = await res.text();
  if (!res.ok) throw new Error('UPDATE ' + table + ' failed: ' + res.status + ' — ' + body);
  return JSON.parse(body);
}

async function dbDelete(table, query) {
  const url = SUPA_REST + table + '?' + query;
  const res = await fetch(url, { method: 'DELETE', headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Prefer': 'return=representation' } });
  if (!res.ok) { const body = await res.text(); throw new Error('DELETE ' + table + ' failed: ' + res.status + ' — ' + body); }
  return true;
}

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function showLoading(v) { const el = document.getElementById('loading'); if (el) el.style.display = v ? 'flex' : 'none'; }
function showError(msg) { const t = document.getElementById('error-toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 4000); }
function setConnectionStatus(ok) {
  const ind = document.getElementById('status-indicator');
  if (!ind) return;
  ind.style.display = 'block';
  ind.textContent = ok ? '🟢 Connected' : '🔴 Disconnected';
  ind.style.color = ok ? '#2D6B3E' : '#8B1A1A';
}
function showFatalError(msg) {
  showLoading(false);
  setConnectionStatus(false);
  document.getElementById('app').style.display = 'block';
  document.getElementById('app').innerHTML = '<div class="screen"><div class="screen-card"><h2>⚠️ Connection Error</h2><p style="color:var(--error);">' + esc(msg) + '</p><button class="btn btn-primary" style="margin-top:14px;" onclick="init()">🔄 Retry</button></div></div>';
}

async function loadAllData() {
  const users = await dbGet('users', 'order=created_at.asc');
  STATE.users = users || [];
  const wishlist = await dbGet('wishlist', 'order=created_at.asc');
  STATE.wishlist = wishlist || [];
  const [ds, pr, rv] = await Promise.all([
    dbGet('desire_scores', 'order=created_at.asc'),
    dbGet('pending_reviews', 'order=created_at.asc'),
    dbGet('reviews', 'order=created_at.asc')
  ]);
  STATE.desireScores = ds || [];
  STATE.pendingReviews = pr || [];
  STATE.reviews = rv || [];
}

function getCompletedRestaurants() {
  if (STATE.users.length < 2) return [];
  const [u1, u2] = STATE.users;
  return STATE.pendingReviews.filter(pr => {
    const rr = STATE.reviews.filter(r => r.restaurant_id === pr.id);
    return rr.some(r => r.user_name === u1.name) && rr.some(r => r.user_name === u2.name);
  });
}

function getPendingOnly() {
  const completed = getCompletedRestaurants().map(c => c.id);
  return STATE.pendingReviews.filter(pr => !completed.includes(pr.id));
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,''');
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (!STATE.currentUser) {
    app.innerHTML = STATE.users.length < 2 ? renderSetup() : renderLogin();
    return;
  }
  app.innerHTML = renderHeader() + renderTabs() + '<div id="tab-content">' + renderActiveTab() + '</div>';
}

function renderSetup() {
  const n = STATE.users.length + 1;
  return '<div class="screen"><div class="screen-card"><h2>🍽️ Welcome to Restaurant Tracker</h2><p>Set up 2 user profiles to get started.</p>' +
    (STATE.users.length > 0 ? '<div class="banner banner-success">✓ User 1: <strong>' + esc(STATE.users[0].name) + '</strong></div>' : '') +
    '<div class="setup-step"><h3>Create User ' + n + '</h3>' +
    '<div class="form-group"><label>Name</label><input type="text" id="setup-name" placeholder="e.g. Alex" maxlength="30"></div>' +
    '<div class="form-group"><label>4-Digit PIN</label><input type="password" id="setup-pin" placeholder="••••" maxlength="4" inputmode="numeric"></div>' +
    '<button class="btn btn-primary" onclick="submitSetup()">Create User ' + n + '</button></div></div></div>';
}

async function submitSetup() {
  const name = (document.getElementById('setup-name').value || '').trim();
  const pin = (document.getElementById('setup-pin').value || '').trim();
  if (!name) return showError('Please enter a name.');
  if (!/^\d{4}$/.test(pin)) return showError('PIN must be exactly 4 digits.');
  if (STATE.users.some(u => u.name.toLowerCase() === name.toLowerCase())) return showError('Name already taken.');
  showLoading(true);
  try {
    await dbInsert('users', { id: uuid(), name, pin });
    await loadAllData();
    render();
  } catch(e) { showError('Failed: ' + e.message); }
  finally { showLoading(false); }
}

function renderLogin() {
  const sel = STATE.loginSelectedUser;
  return '<div class="screen"><div class="screen-card"><h2>🍽️ Restaurant Tracker</h2><p>Select your profile to log in.</p>' +
    '<div class="user-cards">' + STATE.users.map((u,i) =>
      '<div class="user-card' + (sel===u.name?' selected':'') + '" onclick="selectLoginUser(\'' + esc(u.name) + '\')">' +
      '<div class="user-card-avatar">' + ['🧑','👤'][i] + '</div>' +
      '<div class="user-card-name">' + esc(u.name) + '</div></div>'
    ).join('') + '</div>' +
    (sel ? '<div id="pin-section"><div class="form-group"><label>PIN for ' + esc(sel) + '</label>' +
      '<input type="password" id="login-pin" placeholder="••••" maxlength="4" inputmode="numeric" onkeydown="if(event.key===\'Enter\')submitLogin()"></div>' +
      '<button class="btn btn-gold" onclick="submitLogin()">Log In as ' + esc(sel) + '</button></div>' : '') +
    '</div></div>';
}

function selectLoginUser(name) { STATE.loginSelectedUser = name; render(); setTimeout(() => { const el = document.getElementById('login-pin'); if (el) el.focus(); }, 50); }

async function submitLogin() {
  const name = STATE.loginSelectedUser;
  const pin = (document.getElementById('login-pin').value || '').trim();
  if (!pin) return showError('Enter your PIN.');
  const user = STATE.users.find(u => u.name === name);
  if (!user) return showError('User not found.');
  if (user.pin !== pin) return showError('Incorrect PIN.');
  STATE.currentUser = user.name;
  setSession('currentUser', user.name);
  STATE.loginSelectedUser = null;
  await initNotifications();
  render();
}

function renderHeader() {
  return '<header><h1>🍽️ <span>Restaurant</span> Tracker</h1>' +
    '<div id="user-info"><span>👤 ' + esc(STATE.currentUser) + '</span>' +
    '<div id="notifBellContainer" class="notif-bell-wrap" style="position:relative;"></div>' +
    '<button class="btn-switch" onclick="switchUser()">Switch User</button></div></header>';
}

function switchUser() {
  STATE.currentUser = null;
  clearSession('currentUser');
  STATE.loginSelectedUser = null;
  if (notifPollInterval) clearInterval(notifPollInterval);
  render();
}

const TAB_LABELS = ['🍜 Wishlist','⏳ Pending','✅ Reviewed','🔁 We'd Return'];

function renderTabs() {
  return '<div id="tabs">' + TAB_LABELS.map((t,i) =>
    '<button class="tab-btn' + (STATE.activeTab===i?' active':'') + '" onclick="setTab(' + i + ')">' + t + '</button>'
  ).join('') + '</div>';
}

function setTab(i) {
  STATE.activeTab = i;
  document.querySelectorAll('.tab-btn').forEach((b,idx) => b.classList.toggle('active', idx===i));
  const tc = document.getElementById('tab-content');
  if (tc) tc.innerHTML = renderActiveTab();
}

function renderActiveTab() {
  switch(STATE.activeTab) {
    case 0: return renderWishlist();
    case 1: return renderPending();
    case 2: return renderCompleted();
    case 3: return renderWouldReturn();
    default: return '';
  }
}

function getCombinedScore(restaurantId) {
  return STATE.desireScores.filter(s => s.restaurant_id === restaurantId).reduce((sum,s) => sum + (s.score||0), 0);
}

function renderWishlist() {
  const sorted = [...STATE.wishlist].sort((a,b) => getCombinedScore(b.id) - getCombinedScore(a.id));
  return '<div style="padding-top:16px;">' + renderAddRestaurantForm() +
    '<h3 style="color:var(--burgundy);margin-bottom:10px;font-size:0.95rem;">🏆 Leaderboard (' + sorted.length + ')</h3>' +
    (sorted.length===0 ? '<div class="empty-state"><span>🍽️</span>No restaurants yet. Add one above!</div>' : '') +
    sorted.map((r,i) => renderWishlistCard(r,i)).join('') + '</div>';
}

function renderAddRestaurantForm() {
  return '<div class="form-box"><h3>➕ Add New Restaurant</h3>' +
    '<div class="form-row"><div class="form-group"><label>Restaurant Name *</label><input type="text" id="add-name" placeholder="e.g. La Bella Italia"></div>' +
    '<div class="form-group"><label>Cuisine *</label><input type="text" id="add-cuisine" placeholder="e.g. Italian, Thai…"></div></div>' +
    '<div class="form-group"><label>Notes (optional)</label><textarea id="add-notes" placeholder="Why you want to visit…"></textarea></div>' +
    '<button class="btn btn-gold" onclick="addRestaurant()">Add to Wishlist</button></div>';
}

function renderWishlistCard(r, idx) {
  const [u1,u2] = STATE.users;
  const scores = STATE.desireScores.filter(s => s.restaurant_id === r.id);
  const s1 = scores.find(s => s.user_name === u1.name);
  const s2 = scores.find(s => s.user_name === u2.name);
  const both = s1 && s2;
  const medals = ['🥇','🥈','🥉'];

  function scoreBox(user, score) {
    const mine = user.name === STATE.currentUser;
    if (score) return '<div class="score-box"><h4>' + esc(user.name) + (mine?' (you)':'') + '</h4><div class="score-display">' + (both ? score.score : '?') + '</div><div class="text-sm text-muted mt-8">Submitted ✓</div></div>';
    if (mine) return '<div class="score-box"><h4>' + esc(user.name) + ' (you)</h4><div class="score-input-row"><input type="number" id="score-' + r.id + '-' + esc(user.name) + '" min="1" max="10" placeholder="1-10"><button class="btn btn-sm btn-primary" onclick="submitScore(\'' + r.id + '\',\'' + esc(user.name) + '\')">Submit</button></div></div>';
    return '<div class="score-box"><h4>' + esc(user.name) + '</h4><div class="score-display hidden-score">?</div><div class="text-sm text-muted mt-8">Not submitted yet</div></div>';
  }

  return '<div class="card rank-card">' +
    (both && idx<3 ? '<div class="rank-num">' + medals[idx] + '</div>' : '') +
    '<div class="card-header"><div><div class="card-title">' + esc(r.name) + '</div>' +
    '<div class="card-sub"><span class="tag">' + esc(r.cuisine) + '</span> <span class="text-muted" style="font-size:0.75rem;">Added by ' + esc(r.added_by) + '</span></div>' +
    (r.notes ? '<div style="font-size:0.8rem;color:var(--text-light);margin-top:4px;">' + esc(r.notes) + '</div>' : '') +
    '</div>' + (both ? '<div><div class="combined-score">' + (s1.score+s2.score) + '/20</div></div>' : '') + '</div>' +
    (!both ? '<div class="banner banner-info mt-8">Scores hidden until both users submit.</div>' : '') +
    '<div class="scores-section">' + scoreBox(u1,s1) + scoreBox(u2,s2) + '</div>' +
    '<hr class="divider"><div class="flex-gap">' +
    '<button class="btn btn-sm btn-outline" onclick="markVisited(\'' + r.id + '\')">✓ Mark as Visited</button>' +
    '<button class="btn btn-sm btn-danger" onclick="deleteWishlist(\'' + r.id + '\')">🗑 Delete</button>' +
    '</div></div>';
}

async function addRestaurant() {
  const name = (document.getElementById('add-name').value||'').trim();
  const cuisine = (document.getElementById('add-cuisine').value||'').trim();
  const notes = (document.getElementById('add-notes').value||'').trim();
  if (!name||!cuisine) return showError('Name and cuisine are required.');
  const nl = name.toLowerCase();
  if (STATE.wishlist.some(r=>r.name.toLowerCase()===nl)) return showError('"'+name+'" is already in wishlist.');
  if (STATE.pendingReviews.some(r=>r.name.toLowerCase()===nl)) return showError('"'+name+'" is already in Pending Reviews.');
  showLoading(true);
  try {
    await dbInsert('wishlist', { id: uuid(), name, cuisine, notes, added_by: STATE.currentUser });
    const other = STATE.users.find(u => u.name !== STATE.currentUser);
    if (other) await createNotification(other.name, '🍽️ ' + STATE.currentUser + ' added "' + name + '" to the wishlist!', 'new_restaurant');
    await loadAllData();
    document.getElementById('add-name').value='';
    document.getElementById('add-cuisine').value='';
    document.getElementById('add-notes').value='';
    render();
  } catch(e) { showError('Failed: ' + e.message); }
  finally { showLoading(false); }
}

async function submitScore(restaurantId, userName) {
  if (userName !== STATE.currentUser) return showError('You can only submit your own score.');
  const input = document.getElementById('score-' + restaurantId + '-' + userName);
  if (!input) return;
  const val = parseInt(input.value);
  if (isNaN(val)||val<1||val>10) return showError('Score must be between 1 and 10.');
  if (STATE.desireScores.find(s=>s.restaurant_id===restaurantId&&s.user_name===userName)) return showError('Already submitted.');
  showLoading(true);
  try {
    await dbInsert('desire_scores', { id: uuid(), restaurant_id: restaurantId, user_name: userName, score: val });
    const other = STATE.users.find(u => u.name !== STATE.currentUser);
    if (other) await createNotification(other.name, '⭐ ' + STATE.currentUser + ' scored a restaurant ' + val + '/10!', 'score');
    await loadAllData();
    render();
  } catch(e) { showError('Failed: ' + e.message); }
  finally { showLoading(false); }
}

async function markVisited(restaurantId) {
  if (!confirm('Mark this restaurant as visited? It will move to Pending Reviews.')) return;
  const r = STATE.wishlist.find(x => x.id === restaurantId);
  if (!r) return;
  const pendingId = uuid();
  showLoading(true);
  try {
    await dbInsert('pending_reviews', {
      id: pendingId,
      restaurant_id: restaurantId,
      name: r.name,
      cuisine: r.cuisine,
      visited_at: new Date().toISOString()
    });
    await dbDelete('desire_scores', 'restaurant_id=eq.' + restaurantId);
    await dbDelete('wishlist', 'id=eq.' + restaurantId);
    const other = STATE.users.find(u => u.name !== STATE.currentUser);
    if (other) await createNotification(other.name, '✅ ' + STATE.currentUser + ' marked "' + r.name + '" as visited!', 'visited');
    await loadAllData();
    STATE.activeTab = 1;
    render();
  } catch(e) {
    showError('Failed to mark visited: ' + e.message);
  } finally {
    showLoading(false);
  }
}

async function deleteWishlist(restaurantId) {
  if (!confirm('Delete this restaurant?')) return;
  showLoading(true);
  try {
    await dbDelete('desire_scores', 'restaurant_id=eq.' + restaurantId);
    await dbDelete('wishlist', 'id=eq.' + restaurantId);
    await loadAllData();
    render();
  } catch(e) { showError('Failed: ' + e.message); }
  finally { showLoading(false); }
}

function renderPending() {
  const pending = getPendingOnly();
  return '<div style="padding-top:16px;"><h3 style="color:var(--burgundy);margin-bottom:10px;font-size:0.95rem;">⏳ Awaiting Reviews (' + pending.length + ')</h3>' +
    (pending.length===0 ? '<div class="empty-state"><span>✅</span>No pending reviews!</div>' : '') +
    pending.map(r => renderPendingCard(r)).join('') + '</div>';
}

function renderPendingCard(r) {
  const myReview = STATE.reviews.find(rv => rv.restaurant_id === r.id && rv.user_name === STATE.currentUser);
  const other = STATE.users.find(u => u.name !== STATE.currentUser);
  const otherReview = STATE.reviews.find(rv => rv.restaurant_id === r.id && rv.user_name === other.name);
  const both = myReview && otherReview;
  const visited = r.visited_at ? new Date(r.visited_at).toLocaleDateString() : '';

  return '<div class="card"><div class="card-header"><div><div class="card-title">' + esc(r.name) + '</div>' +
    '<div class="card-sub"><span class="tag">' + esc(r.cuisine) + '</span>' + (visited?' <span class="text-muted">Visited '+visited+'</span>':'') + '</div></div></div>' +
    (!both ? '<div class="banner banner-info mt-8">Reviews hidden until both users submit.</div>' : '') +
    (myReview && !otherReview ? '<div class="banner banner-waiting mt-8">⏳ Awaiting review from ' + esc(other.name) + '</div>' : '') +
    (both ? '<div class="banner banner-success mt-8">✓ Both reviews submitted!</div>' : '') +
    '<div class="review-grid">' + renderReviewCol(r, STATE.currentUser, myReview, false, both) + renderReviewCol(r, other.name, otherReview, true, both) + '</div></div>';
}

function renderReviewCol(r, userName, review, isLocked, both) {
  const mine = userName === STATE.currentUser;
  if (review && both) {
    return '<div class="review-col"><h4>' + esc(userName) + (mine?' (you)':'') + ' ✓</h4>' +
      '<div class="review-field"><label>Food</label> ' + review.food + '/10</div>' +
      '<div class="review-field"><label>Vibes</label> ' + review.vibes + '/10</div>' +
      '<div class="review-field"><label>Service</label> ' + review.service + '/10</div>' +
      '<div class="review-field"><label>Would Go Again</label> <span class="' + (review.would_go_again?'would-yes':'would-no') + '">' + (review.would_go_again?'✓ Yes':'✗ No') + '</span></div>' +
      '<div class="review-field"><label>Favourite Dish</label> ' + esc(review.favourite_dish||'—') + '</div></div>';
  }
  if (review && !both) return '<div class="review-col"><h4>' + esc(userName) + (mine?' (you)':'') + ' ✓</h4><div class="text-muted text-sm">Submitted — waiting for other review.</div></div>';
  if (!mine || isLocked) return '<div class="review-col locked"><h4>' + esc(userName) + '</h4><div class="text-muted text-sm">Not submitted yet.</div></div>';
  return '<div class="review-col"><h4>' + esc(userName) + ' (you)</h4>' +
    '<div class="review-field"><label>Food /10</label><input type="number" id="rv-food-' + r.id + '" min="1" max="10" placeholder="1-10"></div>' +
    '<div class="review-field"><label>Vibes /10</label><input type="number" id="rv-vibes-' + r.id + '" min="1" max="10" placeholder="1-10"></div>' +
    '<div class="review-field"><label>Service /10</label><input type="number" id="rv-service-' + r.id + '" min="1" max="10" placeholder="1-10"></div>' +
    '<div class="review-field"><label>Would Go Again?</label><select id="rv-wga-' + r.id + '"><option value="">Select…</option><option value="yes">Yes</option><option value="no">No</option></select></div>' +
    '<div class="review-field"><label>Favourite Dish</label><input type="text" id="rv-dish-' + r.id + '" placeholder="e.g. Truffle pasta"></div>' +
    '<button class="btn btn-gold btn-sm" style="margin-top:6px;" onclick="submitReview(\'' + r.id + '\')">Submit Review</button></div>';
}

async function submitReview(restaurantId) {
  const food = parseInt(document.getElementById('rv-food-' + restaurantId).value);
  const vibes = parseInt(document.getElementById('rv-vibes-' + restaurantId).value);
  const service = parseInt(document.getElementById('rv-service-' + restaurantId).value);
  const wga = document.getElementById('rv-wga-' + restaurantId).value;
  const dish = (document.getElementById('rv-dish-' + restaurantId).value||'').trim();
  if ([food,vibes,service].some(v=>isNaN(v)||v<1||v>10)) return showError('All scores must be 1–10.');
  if (!wga) return showError('Please select Would Go Again.');
  showLoading(true);
  try {
    await dbInsert('reviews', { id: uuid(), restaurant_id: restaurantId, user_name: STATE.currentUser, food, vibes, service, would_go_again: wga==='yes', favourite_dish: dish });
    const other = STATE.users.find(u => u.name !== STATE.currentUser);
    const pr = STATE.pendingReviews.find(p => p.id === restaurantId);
    if (other && pr) await createNotification(other.name, '📝 ' + STATE.currentUser + ' reviewed "' + pr.name + '"!', 'review');
    await loadAllData();
    if (getCompletedRestaurants().some(r => r.id === restaurantId)) STATE.activeTab = 2;
    render();
  } catch(e) { showError('Failed: ' + e.message); }
  finally { showLoading(false); }
}

function renderCompleted() {
  const completed = getCompletedRestaurants();
  if (STATE.users.length < 2) return '<div class="empty-state"><span>👤</span>Need 2 users.</div>';
  const [u1,u2] = STATE.users;
  const ranked = completed.map(r => {
    const rv1 = STATE.reviews.find(rv=>rv.restaurant_id===r.id&&rv.user_name===u1.name);
    const rv2 = STATE.reviews.find(rv=>rv.restaurant_id===r.id&&rv.user_name===u2.name);
    const avg1 = rv1 ? (rv1.food+rv1.vibes+rv1.service)/3 : 0;
    const avg2 = rv2 ? (rv2.food+rv2.vibes+rv2.service)/3 : 0;
    return { r, rv1, rv2, combined: parseFloat((avg1+avg2).toFixed(1)) };
  }).sort((a,b) => b.combined-a.combined);

  const medals = ['🥇','🥈','🥉'];
  const avg = ranked.length ? (ranked.reduce((s,x)=>s+x.combined,0)/ranked.length).toFixed(1) : '—';

  return '<div style="padding-top:16px;"><div class="stats-row">' +
    '<div class="stat-box"><div class="stat-num">' + ranked.length + '</div><div class="stat-label">Total Visited</div></div>' +
    '<div class="stat-box"><div class="stat-num">' + avg + '</div><div class="stat-label">Avg Score</div></div>' +
    '<div class="stat-box"><div class="stat-num" style="font-size:1rem;">' + (ranked.length?esc(ranked[0].r.name):'—') + '</div><div class="stat-label">Top Scorer</div></div>' +
    '</div><h3 style="color:var(--burgundy);margin-bottom:10px;font-size:0.95rem;">🏆 Rankings (' + ranked.length + ')</h3>' +
    (ranked.length===0?'<div class="empty-state"><span>🍽️</span>No completed reviews yet.</div>':'') +
    ranked.map(({r,rv1,rv2,combined},idx) => {
      function sb(label,rv) {
        if (!rv) return '<div class="score-box"><h4>'+esc(label)+'</h4><div class="text-muted text-sm">No review</div></div>';
        return '<div class="score-box"><h4>'+esc(label)+'</h4><div style="font-size:0.8rem;line-height:1.8;">' +
          '<div>🍕 Food: <strong>'+rv.food+'/10</strong></div>' +
          '<div>✨ Vibes: <strong>'+rv.vibes+'/10</strong></div>' +
          '<div>🛎 Service: <strong>'+rv.service+'/10</strong></div>' +
          '<div>Avg: <strong>'+((rv.food+rv.vibes+rv.service)/3).toFixed(1)+'</strong></div>' +
          '<div>Return: <span class="'+(rv.would_go_again?'would-yes':'would-no')+'">'+(rv.would_go_again?'✓ Yes':'✗ No')+'</span></div>' +
          '<div>🍽 <em>'+esc(rv.favourite_dish||'—')+'</em></div></div></div>';
      }
      return '<div class="card rank-card"><div class="rank-num">'+(idx<3?medals[idx]:'#'+(idx+1))+'</div>' +
        '<div class="card-header"><div><div class="card-title">'+esc(r.name)+'</div>' +
        '<div class="card-sub"><span class="tag">'+esc(r.cuisine)+'</span></div></div>' +
        '<div class="combined-score">'+combined+'/20</div></div>' +
        '<div class="scores-section mt-8">'+sb(u1.name,rv1)+sb(u2.name,rv2)+'</div></div>';
    }).join('') + '</div>';
}

function renderWouldReturn() {
  if (STATE.users.length < 2) return '<div class="empty-state"><span>👤</span>Need 2 users.</div>';
  const [u1,u2] = STATE.users;
  const list = getCompletedRestaurants()
    .map(r => {
      const rv1 = STATE.reviews.find(rv=>rv.restaurant_id===r.id&&rv.user_name===u1.name);
      const rv2 = STATE.reviews.find(rv=>rv.restaurant_id===r.id&&rv.user_name===u2.name);
      return {r,rv1,rv2};
    })
    .filter(({rv1,rv2}) => rv1&&rv2&&rv1.would_go_again&&rv2.would_go_again)
    .map(({r,rv1,rv2}) => ({r,rv1,rv2,combined:parseFloat((((rv1.food+rv1.vibes+rv1.service)/3)+((rv2.food+rv2.vibes+rv2.service)/3)).toFixed(1))}))
    .sort((a,b) => b.combined-a.combined);
  const medals = ['🥇','🥈','🥉'];
  return '<div style="padding-top:16px;"><h3 style="color:var(--burgundy);margin-bottom:10px;font-size:0.95rem;">🔁 We'd Go Back Here! (' + list.length + ')</h3>' +
    (list.length===0?'<div class="empty-state"><span>💭</span>No mutual "would go again" yet!</div>':'') +
    list.map(({r,rv1,rv2,combined},idx) =>
      '<div class="card"><div class="card-header"><div><div style="font-size:1.1rem;">'+(idx<3?medals[idx]:'#'+(idx+1))+' <strong>'+esc(r.name)+'</strong></div>' +
      '<div class="card-sub"><span class="tag">'+esc(r.cuisine)+'</span></div></div>' +
      '<div class="combined-score">'+combined+'/20</div></div>' +
      '<div style="margin-top:10px;font-size:0.82rem;display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
      '<div><div class="text-muted">'+esc(u1.name)+''s fave:</div><div style="font-style:italic;">'+esc(rv1.favourite_dish||'—')+'</div></div>' +
      '<div><div class="text-muted">'+esc(u2.name)+''s fave:</div><div style="font-style:italic;">'+esc(rv2.favourite_dish||'—')+'</div></div>' +
      '</div></div>'
    ).join('') + '</div>';
}

// NOTIFICATIONS
const VAPID_PUBLIC = 'BFvpuKeKiAHxAQa1jVIcqvxA673TQCybkSY7TemB8_tV3hNg2No0EM3MMtOBaOqPvnZu0fmdvpASwUf1li___ss';
let notifOpen = false;
let notifPollInterval = null;

async function initNotifications() {
  if ('serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register('/sw.js'); } catch(e) {}
  }
  if ('Notification' in window && Notification.permission === 'default') {
    await Notification.requestPermission();
  }
  startNotifPolling();
  setTimeout(renderNotifBell, 200);
}

async function createNotification(forUser, message, type) {
  try {
    await dbInsert('notifications', { id: uuid(), user_name: forUser, message, type, read: false });
  } catch(e) {}
}

async function fetchNotifications() {
  if (!STATE.currentUser) return [];
  try {
    const data = await dbGet('notifications', 'user_name=eq.' + encodeURIComponent(STATE.currentUser) + '&order=created_at.desc&limit=20');
    return data || [];
  } catch(e) { return []; }
}

async function markAllRead() {
  if (!STATE.currentUser) return;
  try {
    await dbUpdate('notifications', 'user_name=eq.' + encodeURIComponent(STATE.currentUser) + '&read=eq.false', { read: true });
    renderNotifBell();
  } catch(e) {}
}

function startNotifPolling() {
  if (notifPollInterval) clearInterval(notifPollInterval);
  notifPollInterval = setInterval(renderNotifBell, 10000);
}

async function renderNotifBell() {
  const container = document.getElementById('notifBellContainer');
  if (!container || !STATE.currentUser) return;
  const notifs = await fetchNotifications();
  const unread = notifs.filter(n => !n.read).length;
  container.innerHTML = '<div class="notif-bell" onclick="toggleNotifDropdown()">' +
    '🔔' + (unread > 0 ? '<span class="notif-badge">' + unread + '</span>' : '') +
    '</div>' +
    '<div class="notif-dropdown" id="notifDropdown" style="display:none;">' +
    '<div class="notif-header"><strong style="font-size:0.85rem;">Notifications</strong>' +
    (unread > 0 ? '<button onclick="markAllRead()" style="font-size:0.72rem;color:var(--burgundy);background:none;border:none;cursor:pointer;">Mark all read</button>' : '') +
    '</div>' +
    (notifs.length === 0 ? '<div style="padding:16px;text-align:center;color:var(--text-light);font-size:0.82rem;">No notifications yet</div>' :
      notifs.map(n => '<div class="notif-item' + (!n.read?' unread':'') + '">' +
        '<div>' + esc(n.message) + '</div>' +
        '<div class="notif-time">' + new Date(n.created_at).toLocaleString() + '</div>' +
        '</div>').join('')) +
    '</div>';
}

function toggleNotifDropdown() {
  const dd = document.getElementById('notifDropdown');
  if (!dd) return;
  notifOpen = !notifOpen;
  dd.style.display = notifOpen ? 'block' : 'none';
  if (notifOpen) markAllRead();
}

async function init() {
  document.getElementById('app').style.display = 'none';
  showLoading(true);
  try {
    await loadAllData();
    const saved = getSession('currentUser');
    if (saved && STATE.users.some(u => u.name === saved)) {
      STATE.currentUser = saved;
      await initNotifications();
    }
    showLoading(false);
    setConnectionStatus(true);
    document.getElementById('app').style.display = 'block';
    render();
  } catch(e) {
    showFatalError(e.message);
  }
}

setInterval(async () => {
  if (!STATE.currentUser) return;
  try {
    await loadAllData();
    setConnectionStatus(true);
    const tc = document.getElementById('tab-content');
    if (tc) tc.innerHTML = renderActiveTab();
    renderNotifBell();
  } catch(e) { setConnectionStatus(false); }
}, 30000);

init();
</script>
